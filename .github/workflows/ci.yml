name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Don't burn a build+deploy on doc-only changes (nothing shippable).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '_attic/**'
      - '.playwright-mcp/**'

# A newer commit on the same ref supersedes an in-flight run — cancel the
# stale one instead of paying for two builds/deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Detect which areas changed so we can skip functions work on
      # frontend-only pushes and deploy ONLY the targets that moved.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            functions:
              - 'functions/**'
            firestore:
              - 'firestore.rules'
              - 'firestore.indexes.json'
            storage:
              - 'storage.rules'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # Functions deps only when functions changed — needed for the PR verify
      # build and for the deploy predeploy hook. Skipped on frontend pushes.
      - name: Install functions dependencies
        if: steps.changes.outputs.functions == 'true'
        run: npm ci --prefix functions

      # Repo-consistency assertions (scripts/doctor.mjs). --no-cloud runs only
      # the checks that need no credentials: copy-vs-feature-flags, locale key
      # parity and markdown hygiene. The gcloud/firebase/gh-backed checks
      # (released ruleset, deployed functions, free-tier ceilings, issue
      # tracker) SKIP here and are run from a workstation before deploying —
      # CI has no credentials and a SKIP must never read as a pass.
      #
      # Runs before the tests: it is seconds long and catches the class of
      # error a green test suite cannot (copy promising a flagged-off feature,
      # a locale missing a key, a doc linking to a file that was deleted).
      - name: Doctor (credential-free checks)
        run: npm run doctor -- --no-cloud

      - name: Unit tests
        run: npx ng test --watch=false

      # `ng test` covers the ANGULAR APP ONLY — it does not pick up
      # packages/core's specs. Before this step, 563 core tests (TDEE, targets,
      # body-fat, date math, the Firestore mappers both apps share) passed on a
      # workstation and gated nothing: a PR could break the Navy body-fat
      # formula and go green.
      - name: Core tests (packages/core)
        run: npm --prefix packages/core test

      - name: Core typecheck (packages/core)
        run: npm --prefix packages/core run typecheck

      # apps/mobile is not a build target here (EAS builds the binaries), but a
      # typecheck is cheap and catches the cross-app breakage that matters:
      # packages/core is imported by BOTH frontends, so a core change that
      # compiles for the PWA can still break the Expo app.
      - name: Mobile typecheck (apps/mobile)
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      # The emulator-backed suites. firebase-tools refuses to boot an emulator
      # on a JDK older than 21 (see docs/DEV_ENVIRONMENT.md §0 — the same trap
      # exists on the owner's workstation, where `java` resolves to 17).
      - name: Set up JDK 21 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # firestore.rules IS the access-control layer — there is no app server —
      # so an unverified rules change is an unverified security boundary.
      # Needs functions deps regardless of paths-filter: the suite lives there.
      - name: Install functions dependencies (rules tests)
        if: steps.changes.outputs.functions != 'true'
        run: npm ci --prefix functions

      # firebase-tools is deliberately NOT a repo dependency — it is a global
      # CLI on the owner's workstation, and vendoring it would add a very large
      # tree to every `npm ci`. CI has no such global, so install it here,
      # pinned to the major the workstation runs (15.x as of 2026-08-05) so the
      # emulator that gates a PR is the emulator the owner tested against.
      - name: Install firebase-tools (emulator runner)
        run: npm i -g firebase-tools@^15

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Ledger core tests (emulator)
        run: npm run test:ledger

      # Verify functions compile on PRs. On push we skip this: the firebase
      # deploy predeploy hook (`npm --prefix functions run build`) compiles
      # them, so building here too would be wasted work.
      - name: Build functions (PR verify)
        if: github.event_name == 'pull_request' && steps.changes.outputs.functions == 'true'
        run: npm run build --prefix functions

      # Production build: typechecks the app, emits ngsw.json, and produces the
      # dist that hosting serves. The deploy step reuses this exact output —
      # the build runs once, never twice.
      - name: Build app
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # Deploy is intentionally NOT run in CI — releases are pushed manually
      # from a workstation (`npm run build && firebase deploy`). CI's job is
      # to keep main green (unit tests + a real production build), not to
      # ship. This removed the dependency on the brittle, now-deprecated
      # `firebase login:ci` token that kept expiring and failing the run.
