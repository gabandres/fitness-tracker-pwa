apply plugin: 'com.android.library'

group = 'expo.modules.nativedatepicker'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.nativedatepicker"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // MaterialDatePicker / MaterialTimePicker. NOT a new dependency of the app:
  // expo-router and react-native-screens already pull exactly this version
  // into the release graph (their android/build.gradle), so declaring it here
  // only lets this module compile against it. Keep the version in step with
  // theirs, or Gradle resolves the higher one for everybody.
  implementation 'com.google.android.material:material:1.13.0'
}
