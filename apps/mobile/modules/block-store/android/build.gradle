apply plugin: 'com.android.library'

group = 'expo.modules.blockstore'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.blockstore"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Play services Block Store — the whole point of this module.
  //
  // Deliberately the ONLY dependency beyond what `useCoreDependencies()`
  // supplies. Block Store rides Google's existing Backup and Restore
  // infrastructure, so unlike the Restore Credentials API it needs no
  // relying-party server, no WebAuthn library and no new secret.
  implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"
}
