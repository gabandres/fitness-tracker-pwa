# Sign in on the emulator, so every other flow can assume a session.
#
# ## Credentials come from the environment, never from this file
#
# The repo is public. Pass them in:
#
#   maestro test .maestro/android-signin.yaml \
#     -e EMAIL=qa-test@ignia.fit -e PASSWORD="$(cat ~/qa-pass.txt)"
#
# Use the **QA account**, not `review@ignia.fit` and not `demo@ignia.fit`.
# `review@` is what Apple App Review signs in with — ASC carries those
# credentials forward on every version, and changing that password is a review
# rejection waiting to happen. `demo@` owns the store screenshots.
# `CLAUDE.local.md` has the full account table; `scripts/seed-demo-account.mjs`
# creates and seeds a fresh QA account in one command.
#
# ## Why this is a separate flow
#
# It runs once per emulator, not once per test. Firebase persists the session to
# AsyncStorage, so every other flow here can keep `clearState: false` and stay
# about the thing it actually tests — a sign-in failure inside a measurement
# flow would read as a measurement regression.
#
# Deliberately NOT combined with android-smoke.yaml, which asserts the
# signed-OUT entry point and must therefore keep `clearState: true`.
appId: fit.ignia.app
---
- launchApp:
    clearState: false

# Already signed in from a previous run? Nothing to do. `runFlow` with a
# condition keeps this idempotent, so it can be re-run without thinking.
# Let the app finish booting BEFORE the branch below is evaluated. Measured
# 2026-08-18: `runFlow: when:` is checked the instant `launchApp` returns, and
# a cold start on the simulator is still on its splash then — so the condition
# was false, the block SKIPPED, and the flow failed at the Today assertion
# having typed nothing. The debug dump from the FAILING step (taken seconds
# later) showed the sign-in screen fully rendered, which is what makes this
# look like a selector bug rather than a race. `optional` because when a
# session already exists this screen never appears and the wait must not fail.
- extendedWaitUntil:
    visible:
      id: 'signin-submit'
    timeout: 30000
    optional: true

# Selected by testID, not by text — measured 2026-08-18 on the iOS simulator.
# The signed-out screen's hierarchy there exposes **no `text` attribute on any
# node**: a dump of a perfectly rendered sign-in screen listed the ids `email`,
# `password`, `signin-submit`, `signin-google`, `switch-signin`,
# `switch-signup` and `toggle-password`, and the only strings anywhere in the
# 49 KB of JSON were the simulator's own status bar ("No signal", "Not
# charging"). So `visible: 'Sign in to your account'` was FALSE on the very
# screen it describes, this whole block SKIPPED, and the flow failed at the
# Today assertion having never typed a character — a sign-in failure that reads
# exactly like a broken app. ids are stable across both platforms; the text was
# only ever stable on Android.
- runFlow:
    when:
      visible:
        id: 'signin-submit'
    commands:
      - tapOn:
          id: 'email'
      - inputText: ${EMAIL}
      - tapOn:
          id: 'password'
      - inputText: ${PASSWORD}
      # Tap the tagline (a plain, non-interactive Text) rather than
      # `hideKeyboard`: iOS has no native dismiss API, so Maestro fakes it by
      # scrolling and throws when the keyboard stays up — its own known-issues
      # page prescribes exactly this workaround. It survives here today only
      # because the alphabetic keyboard happens to scroll away; the numeric
      # keypads elsewhere in the suite did not.
      # Dismiss the keyboard by tapping the brand mark — a plain, non-interactive
      # element, and the one node on this screen that is neither a field nor a
      # button. (It used to tap the tagline by text, which no longer resolves on
      # iOS; see the note above.) `hideKeyboard` is not usable: iOS has no
      # native dismiss API, so Maestro fakes it by scrolling and throws when the
      # keyboard stays up — its own known-issues page prescribes this
      # workaround.
      - tapOn:
          id: 'flame'
      # By id, which also settles an ambiguity the text selector had to encode
      # by hand: the screen carries the string "Sign in" TWICE — the Sign in /
      # Sign up segmented toggle (`switch-signin`) and the submit button — and
      # this used to need `index: 1` to avoid tapping the toggle, which when
      # already selected does nothing at all: credentials stay typed, no error
      # appears, and the next assertion fails having done precisely nothing.
      - tapOn:
          id: 'signin-submit'

      # Dismiss iOS's "Save Password?" system dialog HERE, before asserting
      # Today — it appears the instant credentials are submitted and it COVERS
      # Today, so an assert placed after this block fails on a sign-in that
      # actually succeeded (measured 2026-08-09: the capture showed Today
      # rendered behind the dialog). Android never shows it, hence optional.
      - tapOn:
          text: 'Not Now'
          optional: true

      # The session landed and Today rendered. Asserting on a Today-screen
      # element rather than on the absence of the sign-in screen: "not visible"
      # would also pass on a blank screen after a crash.
      - extendedWaitUntil:
          visible: 'Today'
          timeout: 30000

# iOS offers to save the password in a system dialog that covers Today and
# fails a bare visibility assert. Optional: Android never shows it.
- tapOn:
    text: 'Not Now'
    optional: true
- assertVisible: 'Today'
