# Settings, entered through the avatar (testID, since it renders initials).
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'settings-open'
- takeScreenshot: .maestro/regression/shots/04-settings-top
# 60s, not 20s. Measured on the LG G6 (API 28) 2026-08-23: a scroll from the
# TOP of Settings to "Quick add" takes ~31s on this device — the sheet is long
# (17 sections) and each swipe is followed by a hierarchy dump. At 20s the
# scroll gave up roughly two thirds of the way down and reported "Quick add"
# missing, which reads as a deleted section rather than an unfinished scroll.
#
# It passed here for months because the settings ScrollView RETAINED ITS SCROLL
# POSITION between opens: whenever an earlier flow left the sheet part-way
# down, the remaining distance fit inside 20s. So this was never flake — it was
# a budget that only held when a previous flow happened to pay part of the
# cost, and it broke the day the suite ran in a different order. (Since S21-1,
# 2026-10-06, Settings is a pushed root-stack screen that mounts fresh at the
# top on every open, so the full distance is now paid every time.)
- scrollUntilVisible:
    element:
      text: 'Quick add'
    direction: DOWN
    timeout: 60000
- takeScreenshot: .maestro/regression/shots/04-settings-quickadd
- scroll
- takeScreenshot: .maestro/regression/shots/04-settings-lower
# Back to Today — the README asks every flow to hand the app back there.
# Since S21-1 (2026-10-06) Settings is a ROOT-stack screen with the shared
# native header, the same shape as 05-history's day screen: Maestro's iOS
# `back` is a no-op, so iOS taps the header's `BackButton` identifier and
# Android keeps hardware back. The drawn `settings-back` it replaced now
# renders only when Settings is opened cold with nothing beneath it
# (`OrphanBack`, app/_layout.tsx). The native header does not scroll away, so
# the old swipe-to-the-top before reaching for it is gone too.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'BackButton'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: 'hero-rings'
    timeout: 10000
