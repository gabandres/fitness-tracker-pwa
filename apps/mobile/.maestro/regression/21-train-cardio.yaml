# CARDIO BLOCKS on a workout session — ADR-0025.
#
# What only a device run can prove here, and jest cannot:
#   - the cardio card's inputs LAY OUT beside each other rather than collapsing
#     (RNTL renders the element tree and never runs a Yoga layout pass — the
#     blind spot that shipped a collapsed search field on 2026-08-08 and an
#     invisible "Repeat yesterday" on 2026-08-22, both `flex` bugs);
#   - the summary line recomputes from a real keystroke, through the deferred
#     dispatch and the commit-on-blur, rather than from a props object;
#   - a session round-trips through Firestore carrying `cardio`, which is the
#     half no unit test reaches: the rules validate it as an opaque capped list,
#     so a shape error surfaces as a rejected WRITE and nowhere else.
#
# The last one is the reason this flow exists at all. `cardio` was added to
# `isValidWorkoutSession`'s hasOnly() allow-list on 2026-08-24 and deployed
# before any client wrote the field; if that deploy were ever rolled back, every
# assertion below would still pass locally and the write would fail silently on
# the device.
#
# ANDROID NOTE: this covers the MANUAL path only. Cardio IMPORT from the health
# store cannot run here — it needs `android.permission.health.READ_EXERCISE`,
# which is a manifest change and therefore a new binary (ADR-0026 amendment,
# decision 7). Until vc 38 `readWorkouts` returns an empty list on Android by
# design, so there is nothing on screen for a flow to assert.
#
# THREE HARNESS LESSONS, all measured on 2026-08-24 while authoring this:
#   1. Tap the tabs by ID (`tab-train` / `tab-index`) and then ASSERT you
#      arrived. `tapOn: 'Train'` reports COMPLETED whether or not it
#      navigated, and two runs failed three steps later on a missing button
#      with no way to tell a bad tap from a bad screen. Do not diagnose this
#      from `maestro hierarchy` taken after the run — it can cold-start the app
#      onto its initial route, which looks identical to "never navigated".
#   2. Assert the field labels CASE-INSENSITIVELY. They carry
#      `textTransform: 'uppercase'`, which on Android is applied to the TEXT
#      NODE: the hierarchy reads 'DISTANCE (MI)' where the source says
#      'Distance (mi)'. Asserting either literal casing is a platform-gated
#      selector, and coverage.md records what those have cost this suite.
#   3. The leftover-session guard has to SCROLL. Keying it on a visible
#      `discard-workout` — which 16 and 18 both do — silently skips whenever
#      that button is below the fold, and it always is once a session has a few
#      exercises, because Discard sits in the footer under the whole list.
#
# STATE: starts ONE session and DISCARDS it in its own tail, so nothing is left
# in Firestore. If a run dies mid-flow the marker is an in-progress workout on
# Train — the guard below clears it on the next run.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'tab-train'
# Prove we actually LEFT Today. `train-glossary-open` is in the Train header
# and is present in both of that tab's states (idle and mid-session), so it is
# the one anchor that says "navigation worked" without also saying which state
# we landed in. Without it a failed tab tap surfaces three steps later as a
# missing button, which is what cost two runs on 2026-08-24.
# 60s, not 30s. Train subscribes to templates, history, exercises and the week
# summary on first focus, and on the LG G6 (API 28) that has taken ~2 minutes
# from cold — the same budget flows 04/09/10/18/20 already carry. At 30s this
# failed on a cold app while passing on a warm one, which is the shape of a
# flake rather than a defect.
- extendedWaitUntil:
    visible:
      id: 'train-glossary-open'
    timeout: 60000

# Let Train SETTLE before the guard reads it. `runFlow: when:` is a condition
# check with no wait of its own, and this tab subscribes to templates, history,
# exercises and the week summary on first focus — on the LG G6 that has taken
# ~2 minutes.
- waitForAnimationToEnd:
    timeout: 30000

# Clear a session left in progress by an earlier flow's death. See lesson 3.
- runFlow:
    when:
      notVisible:
        id: 'start-workout'
    commands:
      # No centerElement, and a partial-visibility threshold: Discard is the
      # LAST element in the session's scroll view, so it can never be centred
      # and a 100%-visible + centred target scrolls forever. Measured
      # 2026-08-24 — the scroll ran its full 30s against a button that was on
      # screen.
      - scrollUntilVisible:
          element:
            id: 'discard-workout'
          direction: DOWN
          timeout: 30000
          visibilityPercentage: 40
      - tapOn:
          id: 'discard-workout'
      - extendedWaitUntil:
          visible:
            id: 'start-workout'
          timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 60000
- tapOn:
    id: 'start-workout'

# ── 1. Add a cardio block ─────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: 'add-cardio'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'add-cardio'

# The picker is a <BottomSheet>; every sheet in the app is, and
# `sheets-are-one-component.test.ts` fails the build on a hand-rolled one.
- assertVisible: 'What did you do?'
- tapOn:
    id: 'cardio-modality-run'

# ── 2. The card renders with its own fields ───────────────────────
# "Add a duration to log this." is the empty-block line, and asserting it is
# what proves a fresh block is NOT counted as work the user did — the cardio
# form of the `targetReps` footgun ADR-0007 already paid for once.
- assertVisible: 'Run'
- assertVisible: 'Add a duration to log this.'

# Every field on screen at once. If the row collapsed, these are the assertions
# that fail, and they are the ones jest cannot make. The unit is asserted too,
# not just the word: it proves the account is still imperial, which flow 20
# flips and restores.
- assertVisible: '(?i)distance \(mi\)'
- assertVisible: '(?i)avg hr \(bpm\)'
- assertVisible: '(?i)effort'

# ── 3. A real keystroke moves the summary ─────────────────────────
- tapOn:
    id: 'cardio-duration-0'
- inputText: '32'
# Tap OUTSIDE the field to blur it, rather than `hideKeyboard`. Two reasons,
# one per platform, and the Android one is the important one:
#   - iOS: `hideKeyboard` is not supported on the simulator and fails outright.
#   - Android: `hideKeyboard` SUCCEEDS and does not fire the input's `onBlur` —
#     and onBlur is what commits a deferred edit. Measured 2026-08-24 by
#     reading the session doc back out of Firestore after a run that used it:
#     the block was stored with `durationSec: 0` while the screen showed 32:00.
# The session ScrollView sets `keyboardShouldPersistTaps="handled"`, so a tap on
# the card's own title dismisses the keyboard AND blurs the field.
- tapOn: 'Run'

# 32 minutes through `formatDuration` in core: unpadded minutes under an hour.
# If this reads 0:00 the deferred dispatch never committed on blur.
- extendedWaitUntil:
    visible: '32:00'
    timeout: 15000

# ── 4. It survives a round trip through Firestore ─────────────────
# Leave Train and come back: the screen re-reads the active session from the
# ledger, so a `cardio` array the rules rejected would come back missing.
- tapOn:
    id: 'tab-index'
- assertVisible: 'Today'
- tapOn:
    id: 'tab-train'
- extendedWaitUntil:
    visible:
      id: 'train-glossary-open'
    timeout: 60000
# SCROLL before asserting. Returning to Train resets the session ScrollView to
# the top and the cardio card sits below the exercise list, so a bare assert
# fails on an element that is present and merely off-screen — which reads
# exactly like a value that failed to persist. Measured 2026-08-24.
- scrollUntilVisible:
    element:
      id: 'cardio-duration-0'
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
- assertVisible: '32:00'

# ── 5. Tail: discard, leaving no state ────────────────────────────
- scrollUntilVisible:
    element:
      id: 'discard-workout'
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
- tapOn:
    id: 'discard-workout'
- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 20000
