# Refine targets — render-only walkthrough. Asserts the form's top and bottom
# both exist, saves NOTHING: refine-save would recompute the QA account's
# targets and every later flow's ring numbers would move.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'settings-open'
- tapOn:
    id: 'settings-refine'
- assertVisible: 'Refine targets'
- takeScreenshot: .maestro/regression/shots/08-refine-top
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: on the Settings screen this exact pattern put the run on the
# Trends tab instead of hitting the row it had just scrolled to. Centering
# moves the target clear of both bars.
# `optional` + the bounded swipe fallback below is this suite's standard
# adapter for a long form (18-train-template uses it five times). It is not
# belt-and-braces here: measured 2026-09-16, this flow PASSES ALONE twice and
# FAILED inside the full sweep at `No visible element found: id: refine-save`,
# with the hierarchy showing the form correctly rendered and scrolled as far as
# "Weekly pace". The 15s budget was chosen before the form grew an
# `refine-activity-connect` / "Connect Health" block, so `refine-save` now sits
# further down than it used to and a slow scroll under full-suite timing does
# not always reach it. A flow that is green alone and red in sequence is the
# worst kind of red: it gets re-run, passes, and teaches everyone to ignore it.
- scrollUntilVisible:
    element:
      id: 'refine-save'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'refine-save'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- assertVisible:
    id: 'refine-save'
- assertVisible: 'Save targets'
- takeScreenshot: .maestro/regression/shots/08-refine-bottom
# Two screens back: Today → Settings → Refine are all on the ROOT stack since
# S21-1 (2026-10-06), so one back returns to Settings and a second to Today.
# Both wear the shared native header: iOS taps its `BackButton` identifier
# (Maestro's iOS `back` is a no-op), Android keeps hardware back — 05-history's
# convention. The drawn `refine-back` / `settings-back` render only on a cold
# open with nothing beneath (`OrphanBack`, app/_layout.tsx).
#
# The FIRST iOS tap can still pop ONE screen or TWO: Maestro re-taps when the
# hierarchy is slow to confirm, and the header back button sits at the same
# coordinates on both screens (measured with the old drawn chevrons: the first
# run ended on Today with the flow still expecting Settings). So the second
# back is conditional on Settings actually being there. The anchor is
# `settings-daily-targets`, the first row — this flow never scrolled Settings,
# so it is on screen — and NOT bare 'Settings': Today's avatar is labelled
# "Settings" too.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'BackButton'
- runFlow:
    when:
      platform: Android
    commands:
      - back
# Optional wait: lets the pop animation settle onto Settings before the
# condition below reads the screen; costs 5s only when the tap already went
# two deep.
- extendedWaitUntil:
    visible:
      id: 'settings-daily-targets'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'settings-daily-targets'
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: 'BackButton'
      - runFlow:
          when:
            platform: Android
          commands:
            - back
# `id: hero-rings`, 2026-10-04: the hero is one grouped a11y label now
# ("380 of 2,265 kcal, 1,885 left, …"), so no standalone 'kcal left' node
# exists to wait on. The rings' id is unique to Today and locale-free.
- extendedWaitUntil:
    visible:
      id: 'hero-rings'
    timeout: 10000
- assertVisible: 'Today'
