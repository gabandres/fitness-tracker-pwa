# es-PR pass — half the market runs the app in Spanish, and until this flow
# NOTHING had ever rendered it. Flips the profile's preferredLocale through the
# real Settings toggle, re-walks the core surfaces asserting the es-PR strings
# (a translated anchor going missing IS the regression this catches — overflow
# and truncation are what the screenshots are for, since Spanish runs longer
# than English), then flips back to EN so every other flow keeps its anchors.
#
# If this flow DIES midway the account is left in Spanish and later EN flows
# fail on their first assert. Recovery: node scripts/qa-regression-verify.mjs
# set-locale --email <qa email> --locale en   (admin write, takes effect on
# next snapshot), or re-run this flow's tail by hand.
appId: fit.ignia.app
env:
  NONCE: '0'
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
# ── flip to es-PR ──
- tapOn:
    id: 'settings-open'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# END-ANCHORED, not a DOWN scroll. Raising the budget to 60s was necessary and
# NOT sufficient: on 2026-08-23 this flow still failed once at 60s, on this very
# step, while `04-settings` passed twice at the same budget. Some genuine
# stalling remains on the Settings sheet, which is what `coverage.md` predicted
# and what Maestro's own docs warn about — `scrollUntilVisible` "may repeatedly
# interact with static elements instead of triggering the desired scroll".
#
# So: swipe to the END down the left gutter (x=10% has no control to swallow the
# gesture), then search UP. Searching up from a fixed end is deterministic;
# searching down from an unknown middle is what stalled. This is the same shape
# `18-train-template` uses for its cues box, and it reached `settings-signout`
# first try on this device after two DOWN scrolls had failed on it.
- repeat:
    times: 10
    commands:
      - swipe:
          start: 10%, 85%
          end: 10%, 25%
- scrollUntilVisible:
    element:
      id: 'settings-lang-es-PR'
    direction: UP
    timeout: 60000
    visibilityPercentage: 30
    centerElement: true
- tapOn:
    id: 'settings-lang-es-PR'
# The whole screen re-renders in Spanish (title becomes Ajustes).
- assertVisible: 'Ajustes'
- takeScreenshot: .maestro/regression/shots/09-es-settings
- tapOn:
    id: 'settings-back'
# ── Today ──
- assertVisible: 'Hoy'
- takeScreenshot: .maestro/regression/shots/09-es-today-top
- scrollUntilVisible:
    element:
      text: 'Agua'
    direction: DOWN
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/09-es-today-metrics
- scrollUntilVisible:
    element:
      text: 'Registros'
    direction: DOWN
    timeout: 15000
- scroll
- takeScreenshot: .maestro/regression/shots/09-es-today-entries
# ── tabs ──
- tapOn: 'Entrenar'
- takeScreenshot: .maestro/regression/shots/09-es-train
- tapOn: 'Tendencias'
- takeScreenshot: .maestro/regression/shots/09-es-trends
- tapOn: 'Cuerpo'
- takeScreenshot: .maestro/regression/shots/09-es-body
- tapOn: 'Hoy'
# ── add sheet ──
- openLink: 'ignia://?openAdd=${NONCE}-09'
- tapOn:
    text: 'Open'
    optional: true
# IDs here too — they are locale-independent AND immune to the iOS
# icon-merges-into-label problem (see 02-add-sheet).
- extendedWaitUntil:
    visible:
      id: 'open-more'
    timeout: 15000
- assertVisible:
    id: 'open-manual'
- takeScreenshot: .maestro/regression/shots/09-es-sheet
- tapOn:
    id: 'open-more'
- assertVisible:
    id: 'open-mealtext'
- assertVisible:
    id: 'open-recipe'
- takeScreenshot: .maestro/regression/shots/09-es-sheet-moreways
- tapOn:
    id: 'entry-backdrop'
# ── flip back to EN — later flows depend on English anchors ──
# Relaunch first: Today is scrolled to its bottom here and the header avatar
# (settings-open) is OFF-SCREEN — this exact tap is where run 1 died, stranding
# the account in Spanish.
- launchApp:
    clearState: false
- assertVisible: 'Hoy'
- tapOn:
    id: 'settings-open'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# END-ANCHORED, not a DOWN scroll. Raising the budget to 60s was necessary and
# NOT sufficient: on 2026-08-23 this flow still failed once at 60s, on this very
# step, while `04-settings` passed twice at the same budget. Some genuine
# stalling remains on the Settings sheet, which is what `coverage.md` predicted
# and what Maestro's own docs warn about — `scrollUntilVisible` "may repeatedly
# interact with static elements instead of triggering the desired scroll".
#
# So: swipe to the END down the left gutter (x=10% has no control to swallow the
# gesture), then search UP. Searching up from a fixed end is deterministic;
# searching down from an unknown middle is what stalled. This is the same shape
# `18-train-template` uses for its cues box, and it reached `settings-signout`
# first try on this device after two DOWN scrolls had failed on it.
# This is ALSO the flip BACK to English, so a failure here strands the account
# in Spanish and cascades a "Today is not visible" failure into every later EN
# flow — 10, 11, 12, 13 and onward. Recovery:
#   node scripts/qa-regression-verify.mjs set-locale --email <qa> --locale en
- repeat:
    times: 10
    commands:
      - swipe:
          start: 10%, 85%
          end: 10%, 25%
- scrollUntilVisible:
    element:
      id: 'settings-lang-en'
    direction: UP
    timeout: 60000
    visibilityPercentage: 30
    centerElement: true
- tapOn:
    id: 'settings-lang-en'
- assertVisible: 'Settings'
- tapOn:
    id: 'settings-back'
- assertVisible: 'Today'
