# Fresh-account arc, part 1: the VERIFY-EMAIL wall.
#
# This subdirectory is NOT part of the main directory run — `maestro test
# .maestro/regression/` does not recurse — because these flows THROW AWAY the
# signed-in session (clearState: true) and end signed out or as the wrong
# account. Run them deliberately, in order, with the admin script between:
#
#   node scripts/qa-regression-verify.mjs create-empty --email <e> --password <p> --unverified
#   maestro test .maestro/regression/empty/01-verify-email.yaml -e EMAIL=<e> -e PASSWORD=<p>
#   node scripts/qa-regression-verify.mjs set-verified --email <e>
#   maestro test .maestro/regression/empty/02-onboarding-empty.yaml -e EMAIL=<e> -e PASSWORD=<p>
#   node scripts/qa-regression-verify.mjs reset-empty --email <e>   # fresh again for next time
#   maestro test .maestro/android-signin.yaml -e EMAIL=<qa email> -e PASSWORD=<qa pass>
#
# The email address must contain demo|test|review|appstore (script guard).
appId: fit.ignia.app
# `manual` keeps this OUT of a directory run — config.yaml excludes the tag.
# Without it Maestro walked into empty/ anyway (measured: a 15-flow suite ran
# 16 flows), and this one signs the sandbox OUT mid-suite.
tags:
  - manual
---
- launchApp:
    clearState: true
# The welcome intro (2026-09-02) stands in front of the form on every
# signed-out launch; its sign-in link is the way to the fields below.
- extendedWaitUntil:
    visible:
      id: 'welcome-signin'
    timeout: 30000
- tapOn:
    id: 'welcome-signin'
- extendedWaitUntil:
    visible: 'Sign in to your account'
    timeout: 30000
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
# Not `hideKeyboard` — iOS throws on it (see android-signin.yaml).
- tapOn: 'Sign in to your account'
# Index 1: the screen carries "Sign in" twice (toggle + submit) — same trap as
# android-signin.yaml.
- tapOn:
    text: 'Sign in'
    index: 1
# iOS shows a "Save Password?" system dialog the instant credentials are
# submitted, and it COVERS the wall. Dismiss it HERE, before asserting —
# `android-signin.yaml` learned this on 2026-08-09 and this flow did not,
# because it is excluded from directory runs and had never run on iOS at
# all. Measured 2026-08-18: the assert below failed on a sign-in that had
# fully succeeded, with the dialog sitting on top of the screen it wanted.
# Android never shows it, hence optional.
- tapOn:
    text: 'Not Now'
    optional: true
# Unverified account → the verify-email wall, not Today, not onboarding.
- extendedWaitUntil:
    visible: 'Verify your email to continue.'
    timeout: 30000
- assertVisible: 'I verified — refresh'
- takeScreenshot: .maestro/regression/shots/empty-01-verify-email
