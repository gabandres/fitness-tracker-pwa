# Fresh-account arc, part 2: ONBOARDING → the empty states.
#
# Prereq: part 1 ran and the account was then admin-verified (see 01's header).
# The relaunch makes the app re-read the token; a verified account with no
# profile routes to onboarding.
#
# Walks the real first-run funnel — welcome → goal → weight → goal weight →
# plan preview → save — then captures every tab in its never-logged-anything
# state, which no other flow can reach (the main QA account has history by
# design). Ends SIGNED OUT so the sandbox is in a known state for re-signin.
appId: fit.ignia.app
# `manual` keeps this OUT of a directory run — config.yaml excludes the tag.
# Without it Maestro walked into empty/ anyway (measured: a 15-flow suite ran
# 16 flows), and this one signs the sandbox OUT mid-suite.
tags:
  - manual
---
# `clearState: true` and a FRESH SIGN-IN, not a warm relaunch — measured
# 2026-08-18, on this arc's first-ever iOS run.
#
# This flow used to relaunch warm and lean on the wall's refresh button to
# pick up the new claim. That only works if the wall renders. It does not:
# after `set-verified` the app routes straight into onboarding, so the
# refresh never fires, the client keeps its PRE-verification token, and the
# whole funnel completes and then fails at the last step with "Please verify
# your email first". The capture shows "You're all set" and a computed plan
# of 1,980 kcal / 130g — everything worked except the save.
#
# A fresh sign-in mints a token that carries emailVerified, which is the
# only reliable way to get it. Keep the wall-refresh branch below anyway:
# it costs nothing and covers a run where the wall DOES appear.
- launchApp:
    clearState: true
    stopApp: true
# The welcome intro (2026-09-02) stands in front of the form on every
# signed-out launch; its sign-in link is the way to the fields below.
- extendedWaitUntil:
    visible:
      id: 'welcome-signin'
    timeout: 30000
- tapOn:
    id: 'welcome-signin'
- extendedWaitUntil:
    visible: 'Sign in to your account'
    timeout: 30000
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn: 'Sign in to your account'
- tapOn:
    text: 'Sign in'
    index: 1
# iOS's "Save Password?" dialog covers whatever comes next. Android never
# shows it, hence optional. Same trap as android-signin.yaml and empty/01.
- tapOn:
    text: 'Not Now'
    optional: true
- runFlow:
    when:
      visible: 'Verify your email to continue.'
    commands:
      - tapOn: 'I verified — refresh'
- extendedWaitUntil:
    visible: 'Welcome to Ignia'
    timeout: 30000
- takeScreenshot: .maestro/regression/shots/empty-02-welcome
- tapOn:
    id: 'onboarding-next'
# Trailing .* on these three: Maestro text is a full-match regex and the
# question mark would otherwise quantify, not match.
- assertVisible: "What's your goal.*"
- tapOn:
    id: 'onboarding-goal-lose'
- takeScreenshot: .maestro/regression/shots/empty-02-goal
- tapOn:
    id: 'onboarding-next'
- assertVisible: 'What do you weigh now.*'
- tapOn:
    id: 'onboarding-weight'
- inputText: '180'
- tapOn:
    id: 'onboarding-next'
- assertVisible: "What's your goal weight.*"
- tapOn:
    id: 'onboarding-target-weight'
- inputText: '165'
- takeScreenshot: .maestro/regression/shots/empty-02-weights
- tapOn:
    id: 'onboarding-next'
- assertVisible:
    id: 'onboarding-preview'
- takeScreenshot: .maestro/regression/shots/empty-02-plan
- tapOn:
    id: 'onboarding-save'
# ── the empty states ──
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'No entries yet.'
    direction: DOWN
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/empty-02-today
- tapOn:
    id: 'open-history'
- assertVisible: 'No history yet.'
- takeScreenshot: .maestro/regression/shots/empty-02-history
- back
- tapOn: 'Train'
- takeScreenshot: .maestro/regression/shots/empty-02-train
- tapOn: 'Trends'
- takeScreenshot: .maestro/regression/shots/empty-02-trends
- tapOn: 'Body'
- takeScreenshot: .maestro/regression/shots/empty-02-body
- tapOn: 'Today'
# ── leave the sandbox signed out ──
- tapOn:
    id: 'settings-open'
# Wait, do not scroll. Sign out sits high in Settings on a FRESH account —
# measured 2026-08-18 at bounds [41,564][361,584] on a 874pt screen, well
# clear of the tab bar, on the first screenful. `scrollUntilVisible` failed
# here at both 100% and 60% visibility WHILE the failure dump showed the
# button fully on screen, so the percentage was never the problem: the
# scroll was hunting for something already in front of it. The Sign-in
# methods section below it renders only for an account with no linked
# provider, which is exactly this account and not the main QA one — so the
# two Settings screens are different heights, and a scroll tuned on one
# does not transfer.
# `speed: 10` is the fix, and the diagnosis took three attempts, so it is
# worth stating plainly. At the default speed 40 this scroll failed at 100%
# visibility, at 60%, and a bare wait failed too — while the hierarchy
# Maestro dumps ON failure showed the button fully on screen at
# [41,564][361,584]. That combination only fits one explanation: the scroll
# DOES reach the target, and the visibility check races the swipe's
# momentum, so the tree Maestro tests is a frame that has already moved.
# A slower swipe carries less momentum and the check lands on a settled
# frame. Reach for speed before percentage when a failure capture shows the
# element plainly present.
- scrollUntilVisible:
    element:
      id: 'settings-signout'
    direction: DOWN
    timeout: 25000
    speed: 10
# centerElement, NOT a lowered visibilityPercentage. Sign out is MID-list on
# this account — the Sign-in methods section renders below it, because a
# fresh email/password account has no linked provider — so the documented
# mid-list rule applies and centring is available. `visibilityPercentage: 30`
# was the wrong lever and made things worse: it let the scroll stop with the
# button 70% off screen, and the tap then landed on a neighbour. The capture
# after it showed Settings still open and parked above the button.
    centerElement: true
# Settle the tree before tapping. With the scroll alone, the tap landed on
# a neighbour — the capture after it showed Settings still open and parked
# on CALORIE FLOOR, and Sign out has no confirmation dialog (`onPress={signOut}`
# in settings.tsx), so a tap that reached it could not have failed quietly.
# Maestro taps layout bounds, and a list still settling from a swipe hands
# it bounds that are one frame stale.
- extendedWaitUntil:
    visible:
      id: 'settings-signout'
    timeout: 10000
- tapOn:
    id: 'settings-signout'
- extendedWaitUntil:
    visible: 'Sign in to your account'
    timeout: 30000
