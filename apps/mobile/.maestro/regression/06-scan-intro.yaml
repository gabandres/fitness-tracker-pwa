# Photo-scan INTRO only — the screen with the three choices. Deliberately taps
# none of them: "Take photo" opens the camera and "Choose from library" opens
# the system picker, and both park the run inside system UI Maestro cannot
# reliably drive. The scan review state stays uncovered here on purpose; it
# needs a photo, which needs hardware or an injected image.
#
# Route: the FAB is a speed dial when photoScan is on — first tap opens the
# dial, log-scan is the camera satellite.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'log-button'
# The dial's satellite buttons do NOT expose their testIDs to the accessibility
# tree (measured: hierarchy carries log-button only) — same species as the
# README's original FAB-chip complaint. The label text is the one addressable
# handle; capture the open dial first, it is the render evidence.
- takeScreenshot: .maestro/regression/shots/06-fab-dial
# Tap the testID, NOT the label text. Measured on Android 2026-08-19: the dial
# opens and "Scan meal" is plainly VISIBLE on screen, but the label is not in
# the hierarchy Maestro sees, so a text tap fails while the button is right
# there. The header comment above used to claim the satellites expose no
# testIDs — that is stale; LogSpeedDial gives them log-scan / log-manual.
- tapOn:
    id: 'log-scan'
    optional: true
# Expect this to WARN on the LG VS988 and fall through to the branch below.
# The satellites sit ~150dp above the tab bar, outside every ancestor's box,
# so uiautomator clamps their bounds to an empty rect — Maestro sees no node
# to tap even though a coordinate tap there works (measured 2026-08-21).
# That is a harness-visibility problem, not a product one.
- runFlow:
    when:
      notVisible: 'Scan a meal'
    commands:
      # Reach the screen by route instead; the screen, not the button, is what
      # the rest of this flow covers.
      #
      # This branch used to tap `log-button` first, to close a dial the deep
      # link would otherwise leave sitting on top of the scan screen —
      # `LogSpeedDial` is rendered by the TAB LAYOUT, so it survived the
      # navigation. On 2026-08-21 that made this flow GREEN while its one piece
      # of audit evidence was the scan screen greyed out under the dial's scrim:
      # `assertVisible` passes on a screen mounted underneath an overlay.
      #
      # It was written up here as a harness artifact and it was not — a real
      # user hit the same state on the scan RESULT the same day (UX_AUDIT,
      # Abdiel Medina). `LogSpeedDial` now closes on any route change, so this
      # deep link dismisses the dial on arrival and the workaround is gone.
      #
      # Two guards that do NOT work, both measured that day and both green:
      # `waitForAnimationToEnd` (nothing is animating — the dial is simply
      # open) and `when: visible: id: log-scan`, which logs SKIPPED every time.
      - openLink: 'ignia:///scan'
      - tapOn:
          text: 'Open'
          optional: true
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 10000
# testIDs, not labels: on iOS the Ionicons glyph merges into each button's
# accessibility label, so a full-match text selector never matches (see
# 02-add-sheet's header for the measurement).
- assertVisible:
    id: 'scan-take'
- assertVisible:
    id: 'scan-choose'
- assertVisible:
    id: 'scan-manual'
- takeScreenshot: .maestro/regression/shots/06-scan-intro
- tapOn:
    id: 'scan-back'
- assertVisible: 'Today'
