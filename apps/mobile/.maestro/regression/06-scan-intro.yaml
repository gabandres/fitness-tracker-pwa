# Photo-scan INTRO only — the screen with the three choices. Deliberately taps
# none of them: "Take photo" opens the camera and "Choose from library" opens
# the system picker, and both park the run inside system UI Maestro cannot
# reliably drive. The scan review state stays uncovered here on purpose; it
# needs a photo, which needs hardware or an injected image.
#
# Route: the FAB is a speed dial when photoScan is on — first tap opens the
# dial, log-scan is the camera satellite.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'log-button'
# The dial's satellite buttons do NOT expose their testIDs to the accessibility
# tree (measured: hierarchy carries log-button only) — same species as the
# README's original FAB-chip complaint. The label text is the one addressable
# handle; capture the open dial first, it is the render evidence.
- takeScreenshot: .maestro/regression/shots/06-fab-dial
# Tap the testID, NOT the label text. Measured on Android 2026-08-19: the dial
# opens and "Scan meal" is plainly VISIBLE on screen, but the label is not in
# the hierarchy Maestro sees, so a text tap fails while the button is right
# there. The header comment above used to claim the satellites expose no
# testIDs — that is stale; LogSpeedDial gives them log-scan / log-manual.
- tapOn:
    id: 'log-scan'
    optional: true
# If that tap hit the label pill (not the button) the dial just closed —
# reach the same screen by route instead; the screen, not the button, is what
# the rest of this flow covers.
- runFlow:
    when:
      notVisible: 'Scan a meal'
    commands:
      # Close the dial FIRST. Reaching this branch means the `log-scan` tap
      # above did not fire `choose()`, so the dial is still OPEN — and
      # `LogSpeedDial` is rendered by the TAB LAYOUT, not by a screen, so it
      # survives the deep link and ends up sitting on top of the scan screen.
      # The three `assertVisible`s below still pass, because the scan screen
      # really is mounted underneath, so on 2026-08-21 this flow was green
      # while its one piece of audit evidence was the scan screen greyed out
      # under the dial's scrim with the pills and close X over it. Exactly the
      # green-line-as-evidence substitution this suite's README warns about.
      #
      # Two fixes that do NOT work, both measured that day and both green:
      # `waitForAnimationToEnd` (nothing is animating — the dial is simply
      # open), and guarding the tap with `when: visible: id: log-scan`, which
      # logs SKIPPED every time because the satellites are absent from the
      # hierarchy on this device. That absence is also why the `log-scan` tap
      # above WARNs and why this branch is the one that runs.
      #
      # Unconditional is safe HERE and only here, because this branch runs only
      # when the dial was left open. `log-button` is a toggle: the same tap on
      # the happy path would OPEN the dial and ruin the capture the other way.
      - tapOn:
          id: 'log-button'
          optional: true
      - openLink: 'ignia:///scan'
      - tapOn:
          text: 'Open'
          optional: true
- extendedWaitUntil:
    visible: 'Scan a meal'
    timeout: 10000
# testIDs, not labels: on iOS the Ionicons glyph merges into each button's
# accessibility label, so a full-match text selector never matches (see
# 02-add-sheet's header for the measurement).
- assertVisible:
    id: 'scan-take'
- assertVisible:
    id: 'scan-choose'
- assertVisible:
    id: 'scan-manual'
- takeScreenshot: .maestro/regression/shots/06-scan-intro
- tapOn:
    id: 'scan-back'
- assertVisible: 'Today'
