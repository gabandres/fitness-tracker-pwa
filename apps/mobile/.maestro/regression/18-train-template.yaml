# The TEMPLATE EDITOR — building and re-opening a workout template.
#
# Closes the gap coverage.md carried as "Not yet authored — 16-train-terms
# covers the SESSION logger only". That gap mattered on 2026-08-18, when the
# editor was rebuilt for readability (per-set targets, collapsed cards,
# "More options") and the whole 16-flow suite would have walked past every
# line of it without touching the screen.
#
# What only a device run can prove here, and jest cannot:
#   - the set TABLE lines up under its own column headers (RNTL renders the
#     element tree and never runs a Yoga layout pass — the exact blind spot
#     that shipped the collapsed search field on 2026-08-08);
#   - the collapsed card's summary is REAL text on screen, not a string in a
#     props object;
#   - a template round-trips through Firestore with its per-set targets, which
#     is the half no unit test reaches: `plannedSets` entries are new fields on
#     a doc whose rules validate `exercises` only as an opaque list.
#
# STATE: creates ONE template and ONE catalog exercise, and deletes both in its
# own tail. If a run dies mid-flow the marker is "QA Tpl Check" (Train →
# Templates) — delete it by hand. The exercise is seeded and untouched.
appId: fit.ignia.app
---
# ── `scrollUntilVisible` has a documented failure on this suite's Android host,
# and every fallback below exists for it. ──
#
# Measured 2026-08-30 on the LG VS988: the command times out while the target is
# ALREADY ON SCREEN. `07-coach`'s hierarchy at the moment of failure had
# `coach-entry` present, clickable and bounded [96,1881][1344,2068], and that
# run's own screenshot shows the button rendered. It is not making progress, and
# relaxing `visibilityPercentage` does not help — coverage.md records both.
#
# So each call gains `optional: true` plus a bounded swipe loop, which is
# Maestro's own "universal adapter" idiom (docs: recipes/choose-images, and
# recipes/custom-scrolling-for-screen-fragments). The shape is deliberate:
#
#   * It is ADDITIVE. These flows are shared with iOS, where `scrollUntilVisible`
#     works (19 of 21 on 2026-08-24) and where there is no device here to
#     re-validate. If the original command succeeds the loop's `while` is false
#     immediately and it costs nothing, so iOS behaviour cannot change.
#   * `while: notVisible` no-ops when the target is already on screen, which is
#     precisely the Android failure.
#   * `times:` bounds it, so a genuinely missing element still fails the flow —
#     later, on the command that needed it — rather than hanging.
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn: 'Train'

# A session left in progress by an earlier flow's death hides the whole idle
# view, and `new-template` is then not on screen for a reason that has nothing
# to do with templates. Same guard as 16.
- runFlow:
    when:
      visible:
        id: 'discard-workout'
    commands:
      - tapOn:
          id: 'discard-workout'
      - extendedWaitUntil:
          visible:
            id: 'start-workout'
          # 60s for the same Train-tab subscription cost noted below.
          timeout: 60000

# ── 1. A new template, named ──────────────────────────────────────
# 60s, not 15s. The Train tab subscribes to templates, history, exercises and
# the week summary on first focus, and on the LG G6 (API 28) after a cold start
# it sat on its spinner for roughly two minutes before any of it rendered —
# measured 2026-08-20. At 15s the scroll gave up while the tab was still empty
# and reported "new-template" missing, which reads as a missing button rather
# than an unfinished load. `+ New` was on screen the whole time once it settled.
- scrollUntilVisible:
    element:
      id: 'new-template'
    direction: DOWN
    timeout: 60000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'new-template'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'new-template'
- assertVisible: 'New template'
- tapOn:
    id: 'template-name'
- inputText: 'QA Tpl Check'
# Dismiss the keyboard by tapping the sheet's own title — Maestro taps an
# element's LAYOUT bounds, so a later tap would otherwise land on the keyboard
# (documented in 14-metrics and 16-train-terms).
- tapOn: 'New template'

# ── 2. Add an exercise from the seeded catalog ────────────────────
# A SEEDED exercise, not a free-typed one. Free-typing writes a new catalog
# doc, which then has to be deleted through two more sheets in the tail — and
# that teardown was the single most fragile thing in this flow (a failed run
# left duplicates behind, which changed the adder's match list and broke
# LATER runs in a way that looked like a UI regression). Picking an existing
# entry needs no write and no cleanup, so the only state this flow creates is
# the template itself.
- tapOn:
    id: 'template-add-exercise'
- inputText: 'Bench'
- tapOn: 'Exercises'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .maestro/regression/shots/18-adder-matches
- tapOn:
    id: 'template-match-0'

# ── 3. The card opens COLLAPSED — the readability change ──────────
# A freshly added exercise opens itself (you added it to edit it), so collapse
# it first and assert the summary is what a closed card shows.
- extendedWaitUntil:
    visible:
      id: 'template-ex-toggle-0'
    timeout: 15000
- tapOn:
    id: 'template-ex-toggle-0'
# Three working sets, nothing prescribed yet: the summary degrades to a count
# rather than inventing numbers.
- assertVisible: '.*3 sets.*'
- assertNotVisible:
    id: 'template-add-set-0'
- assertNotVisible:
    id: 'template-set-weight-0-0'
- takeScreenshot: .maestro/regression/shots/18-card-collapsed

# ── 4. Expanded: the set table and its headers ────────────────────
- tapOn:
    id: 'template-ex-toggle-0'
# Collapsing the card in step 3 scrolls the sheet back up, so on re-expand the
# FIRST set row lands below the fold on a 360x720dp screen and never comes back
# on its own. `extendedWaitUntil` does not scroll, so it burned its full 15s
# against a row that was present, correct and one swipe away, and reported it as
# a missing element. Measured on the LG G6 (API 28) 2026-08-20: a manual swipe
# showed all three rows, both inputs, +Add set/+Add cluster and Save at full
# height.
- scrollUntilVisible:
    element:
      id: 'template-set-weight-0-0'
    timeout: 15000
    visibilityPercentage: 20
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-weight-0-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
# The column headers are the whole point of the table — they are what makes a
# row readable without a legend. Regex, not bare strings: iOS merges sibling
# Texts inside one row into a single label (flow 16 measured this three times),
# so the header row can read "Set, lb, reps" as ONE node there and as three on
# Android. The capture is the real evidence that they line up over their
# columns — an assertion cannot see alignment at all.
- assertVisible: '.*lb.*'
- assertVisible: '.*reps.*'
# Row 1 is a bare number; the type control now lives ON it.
# Scroll first: on a 360x720dp screen the set table's type control sits BELOW
# the fold once the card expands, so a bare assertVisible fails on a control
# that is present and correct. Measured on Android 2026-08-19 (iOS viewports
# are tall enough that it happened to be on-screen there).
- scrollUntilVisible:
    element:
      id: 'template-set-kind-0-0'
    direction: DOWN
    timeout: 20000
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-kind-0-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- assertVisible:
    id: 'template-set-kind-0-0'
- takeScreenshot: .maestro/regression/shots/18-set-table

# ── 5. Prescribe every set ────────────────────────────────────────
# All three, deliberately: the summary only prints numbers when every set
# agrees, because "3 × 8" must not describe a template where one row says 8
# and two say nothing. Filling one row is the OTHER case, covered in jest.
- scrollUntilVisible:
    element:
      id: 'template-set-weight-0-0'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-weight-0-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-weight-0-0'
- inputText: '20'
- scrollUntilVisible:
    element:
      id: 'template-set-reps-0-0'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-reps-0-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-reps-0-0'
- inputText: '8'
- scrollUntilVisible:
    element:
      id: 'template-set-weight-0-1'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-weight-0-1'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-weight-0-1'
- inputText: '20'
- scrollUntilVisible:
    element:
      id: 'template-set-reps-0-1'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-reps-0-1'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-reps-0-1'
- inputText: '8'
- scrollUntilVisible:
    element:
      id: 'template-set-weight-0-2'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-weight-0-2'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-weight-0-2'
- inputText: '20'
- scrollUntilVisible:
    element:
      id: 'template-set-reps-0-2'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-reps-0-2'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-set-reps-0-2'
- inputText: '8'
# NOT `hideKeyboard`: iOS exposes no native dismiss action, so Maestro fakes it
# and throws "Couldn't hide the keyboard" — measured here, and its own error
# prescribes this workaround. `Sets` is the plain field label above the table;
# scroll it into view first, because the last cell tapped was row 3 and the
# label may have gone off the top.
- scrollUntilVisible:
    element:
      text: 'Sets'
    direction: UP
    timeout: 10000
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        text: 'Sets'
    commands:
      - swipe:
          start: 10%, 45%
          end: 10%, 80%
- tapOn: 'Sets'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: .maestro/regression/shots/18-set-prescribed

# ── 6. "More options" — the optional half, one level down ─────────
# Cues and auto-progression used to be on screen for every exercise at once.
# They must NOT be visible until this row is tapped.
- assertNotVisible:
    id: 'template-cues-0'
- scrollUntilVisible:
    element:
      id: 'template-more-0'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-more-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'template-more-0'
# Same 360x720dp problem as the set-kind control above: tapping "More options"
# reveals the cues box BELOW the fold, and extendedWaitUntil does not scroll —
# it just waits out its timeout on a control that rendered correctly offscreen.
# scrollUntilVisible both waits and scrolls. Measured on Android 2026-08-19.
# Explicit swipes down the LEFT MARGIN before the scroll, because
# `scrollUntilVisible` alone stalls here — measured on the LG G6 2026-08-20.
# Its gesture starts mid-screen, and at this scroll position the middle of the
# sheet is the set table's weight/reps TextInputs; the swipe gets eaten by a
# field instead of moving the sheet, so it burns its whole timeout one screen
# short of the target. The capture at failure shows "More options" already
# EXPANDED with the unit selector half-drawn — i.e. the tap worked and only the
# scroll did not. A manual swipe from low on the screen reached the cues box
# immediately, with its two seeded cues, the auto-progression checkbox and
# Remove exercise all rendered at full height. x=10% is the card gutter, which
# has no input to swallow the gesture.
- swipe:
    start: 10%, 85%
    end: 10%, 35%
- swipe:
    start: 10%, 85%
    end: 10%, 35%
# Then come back UP. The two swipes above deliberately run to the END of the
# sheet — "Remove exercise" and Save, with nothing below — because the end is a
# fixed anchor and overshooting it is impossible, whereas stopping ON the cues
# box requires guessing a distance that changes with how many sets exist.
# Searching UP from a known end is deterministic; searching DOWN from an
# unknown middle is what stalled.
- scrollUntilVisible:
    element:
      id: 'template-cues-0'
    direction: UP
    timeout: 20000
    # visibilityPercentage must be RELAXED here. It defaults to 100, and the
    # cues box is the last thing in the sheet: it sits clipped against the nav
    # bar with nothing below it to scroll into, so 100% is unreachable and the
    # scroll times out on a control that is visibly on screen and expanded.
    # Measured on Android 2026-08-19 — the capture shows "More options" open
    # with "Cues (one per line)" half-drawn at the bottom edge.
    visibilityPercentage: 20
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-cues-0'
    commands:
      - swipe:
          start: 10%, 45%
          end: 10%, 80%
- assertVisible:
    id: 'template-cues-0'
- takeScreenshot: .maestro/regression/shots/18-more-options
# The progression checkbox sits below the cues box and is deliberately NOT
# asserted here. The cues field appearing only after this row is tapped
# already proves the disclosure works, and scrolling further is unreliable for
# a structural reason: `template-cues-*` is a MULTILINE TextInput, which on
# iOS is a UITextView — a scrollable. A swipe starting over it scrolls the
# text field, not the sheet, so `scrollUntilVisible` never advances and
# reports "no visible element found" for markup that is plainly present
# (verified in the hierarchy dump). The unit suite covers both fields being
# behind the disclosure; this flow is here for layout and persistence, which
# is what only a device can show.
#
# Close it again before moving on, for the SAME reason: while the cues field
# is on screen every later swipe risks landing on it, and a scroll that
# silently moves nothing reads as a missing element.
#
# Scroll BACK to the toggle before tapping it. Reaching the cues box moved it
# off screen, and this tap had no scroll in front of it — measured 2026-09-04,
# it is where the flow died with *element not found* while every earlier step
# passed. The x=10% swipe is the same precaution as above: dead centre lands on
# the cues TextInput, which scrolls itself and not the sheet.
- scrollUntilVisible:
    element:
      id: 'template-more-0'
    direction: UP
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-more-0'
    commands:
      - swipe:
          start: 10%, 45%
          end: 10%, 80%
- tapOn:
    id: 'template-more-0'
- waitForAnimationToEnd:
    timeout: 5000

# ── 7. Save, and prove the round-trip through Firestore ───────────
- scrollUntilVisible:
    element:
      id: 'save-template'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'save-template'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'save-template'
# 60s, not 15s, for the reason this file already gives at the `new-template`
# scroll: the Train tab re-subscribes to templates, history, exercises and the
# week summary, and on the LG G6 (API 28) that has taken ~2 minutes. 15s
# survived a STANDALONE run and died in the SUITE — measured 2026-09-04, flow 18
# reached its teardown and then timed out here, 4m30s into a 20-flow sweep with
# the device warm. A timeout tuned on an isolated run is not tuned for the run
# that actually matters.
- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 60000
# The saved template's own row, back on the Train tab.
- scrollUntilVisible:
    element:
      text: '.*QA Tpl Check.*'
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        text: '.*QA Tpl Check.*'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- takeScreenshot: .maestro/regression/shots/18-template-saved

# Re-open it: the per-set targets must come back off the doc. This is the
# assertion that a new optional field on `plannedSets` survives a real write
# and a real read — the rules validate `exercises` as an opaque list, so
# nothing else in the stack would notice if it did not.
# By TEXT, not by testID: `edit-template-<id>` carries the Firestore doc id,
# which a flow that just created the template cannot know.
- tapOn: '.*QA Tpl Check.*'
- extendedWaitUntil:
    visible:
      id: 'template-ex-toggle-0'
    timeout: 15000
# Collapsed on re-open, and the summary now carries the numbers that were
# typed — which is only true if reps AND weight both round-tripped through
# Firestore on every set.
- assertVisible: '.*3 × 8 · 20 lb.*'
- takeScreenshot: .maestro/regression/shots/18-reopened-summary
- tapOn:
    id: 'template-ex-toggle-0'
# Scroll, don't just assert. Re-opening the sheet puts it back at the TOP —
# name, notes, rest, exercise picker all above the card — so on a 360x720dp
# screen the first set row is below the fold the moment the card expands, and a
# bare assertVisible fails on a table that round-tripped correctly. Same trap as
# the expand in step 4; measured on the LG G6 2026-08-20, where the capture
# showed "Edit template" scrolled to the top with the Set/lb/reps header just
# reaching the bottom edge.
- scrollUntilVisible:
    element:
      id: 'template-set-weight-0-0'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'template-set-weight-0-0'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- takeScreenshot: .maestro/regression/shots/18-reopened-table

# ── 8. Teardown: leave the account as we found it ─────────────────
# Collapse the card FIRST. Not cosmetic — iOS caps the XCUITest hierarchy it
# will serialise, and with the card expanded the dump comes back ~51 KB with
# its TAIL CUT: `template-more-0`, `save-template` and `delete-template` were
# all absent from it while every `template-set-*` id was present, and a
# capture of that same step showed the Remove button rendered in full. So a
# deep sheet makes its own footer unaddressable, and the failure reads as a
# missing element rather than a truncated tree.
- tapOn:
    id: 'template-ex-toggle-0'
- waitForAnimationToEnd:
    timeout: 5000
# A direct tap, NOT scrollUntilVisible. The Remove button shares the sheet's
# last row with Save, so re-opening the template already leaves it on screen —
# and the scroll variant failed here twice while a capture of that very step
# showed the button rendered in full. Scrolling to something already visible
# is a no-op that Maestro reports as "no visible element found".
- tapOn:
    id: 'delete-template'
# 60s, not 15s, for the reason this file already gives at the `new-template`
# scroll: the Train tab re-subscribes to templates, history, exercises and the
# week summary, and on the LG G6 (API 28) that has taken ~2 minutes. 15s
# survived a STANDALONE run and died in the SUITE — measured 2026-09-04, flow 18
# reached its teardown and then timed out here, 4m30s into a 20-flow sweep with
# the device warm. A timeout tuned on an isolated run is not tuned for the run
# that actually matters.
- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 60000
# Nothing else to clean: the exercise came from the seeded catalog, so the
# template was the only thing this flow ever created.
- takeScreenshot: .maestro/regression/shots/18-teardown
