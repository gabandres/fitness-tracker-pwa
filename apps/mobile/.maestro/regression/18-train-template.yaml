- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 60000
# Nothing else to clean: the exercise came from the seeded catalog, so the
# template was the only thing this flow ever created.
- takeScreenshot: .maestro/regression/shots/18-teardown
