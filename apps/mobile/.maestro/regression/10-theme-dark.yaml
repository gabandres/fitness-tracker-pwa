# Dark-theme pass — the app is dual-theme with dark leading (ADR-0014) and no
# capture had ever run dark. Text assertions are theme-blind, so THE SCREENSHOTS
# ARE THIS FLOW'S ENTIRE VALUE: an invisible-on-dark element still "asserts
# visible". Look at every shot — ink-on-ink text, a light-pinned card, a
# vanished border are what this pass exists to catch.
#
# Theme is per-DEVICE AsyncStorage (not the profile), so a midway failure
# leaves this sandbox dark and every later screenshot dark with it. Recovery:
# re-run this flow, or Settings → Appearance → System by hand. If a later
# flow's shots come out dark, this flow's tail did not run — do not read that
# as "the app went dark on its own".
appId: fit.ignia.app
env:
  NONCE: '0'
---
- launchApp:
    clearState: false
# Wait for the loader to actually GO, the way 20-units-metric does. This flow
# used `assertVisible: 'Today'` alone, which is not a readiness gate at all —
# the tab bar sits UNDER the splash, so the assert passes while the overlay is
# still up and eating taps. Necessary but not sufficient on its own: the splash
# comes BACK at ~3.4s, so the repeat gate below is still required.
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 15000
- assertVisible: 'Today'
# ── flip to dark ──
# THE SPLASH COMES BACK ONCE, AND IT EATS THE TAP. `_layout.tsx` renders
# `<Splash/>` (absoluteFill, zIndex/elevation 100) while
# `initializing || profileLoading || waitingOnProfile || !fontsReady`, and on a
# cold start those do not clear together: measured on the LG G6 2026-08-24 the
# loader is gone at ~1.9s, BACK at ~3.4s, and gone for good at ~5.3s.
# `assertVisible: 'Today'` passes straight THROUGH it — the tab bar is in the
# hierarchy underneath, so the assert is not a readiness gate — and a tap
# landing in that second window is swallowed by the overlay. Maestro then burns
# its whole retryIfNoChange budget (24-27s measured), reports COMPLETED, and the
# app has not navigated; the next scrollUntilVisible spends 60s hunting a
# Settings testID on Today and fails there instead, which reads like the
# Settings refactor broke a testID. It did not. Retry until the destination is
# actually on screen — that is the only gate that cannot race the overlay.
# The gate is `settings-back` and NOT the text 'Settings': Maestro matches text
# as a substring against accessibility labels too, and Today's avatar IS
# labelled "Settings", so `notVisible: 'Settings'` is false on Today and the
# whole repeat block reports SKIPPED — a gate that silently does nothing.
# `settings-back` exists on the Settings screen and nowhere else.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'settings-back'
    commands:
      # optional: the loop re-checks its condition the instant the tap returns,
      # which on this device is mid-navigation — so a second iteration can start
      # after the tap ALREADY worked, by which point `settings-open` is gone with
      # the Today header and a required tap fails the whole flow. Optional makes
      # that harmless: the extra iteration warns, the condition re-reads, done.
      - tapOn:
          id: 'settings-open'
          optional: true
# `repeat` reports COMPLETED when it runs out of iterations, whether or not the
# condition was ever satisfied — it is a bounded retry, not an assertion. Without
# this line a gate that never landed passes silently and the flow dies 60s later
# on the WRONG SCREEN, which is the exact misdirection the gate exists to remove.
# Measured 2026-08-25: that is precisely what happened here on the relaunch.
- assertVisible:
    id: 'settings-back'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# 60s, not 20s — the same LG G6 measurement as 04-settings and 09-locale-es
# (2026-08-23): a scroll from the top of Settings costs tens of seconds on this
# device. This flow failed here on the 2026-08-23 run, and like 09 it leaves
# state behind when it dies — the theme, not the locale.
- scrollUntilVisible:
    element:
      id: 'settings-theme-dark'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-theme-dark'
- takeScreenshot: .maestro/regression/shots/10-dark-settings
# Wait for the header to come back before reaching for it. Switching the theme
# re-renders the whole screen, and on iOS the tap raced that re-render — flow
# 09 taps this very ID successfully, so the button is addressable; it is the
# repaint that is not instant.
- extendedWaitUntil:
    visible:
      id: 'settings-back'
    timeout: 15000
- tapOn:
    id: 'settings-back'
# ── Today, all three scroll positions ──
- extendedWaitUntil:
    visible: 'Today'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-today-top
- scrollUntilVisible:
    element:
      text: 'Water'
    direction: DOWN
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-today-metrics
- scrollUntilVisible:
    element:
      text: 'Entries'
    direction: DOWN
    timeout: 15000
- scroll
- takeScreenshot: .maestro/regression/shots/10-dark-today-entries
# ── tabs ──
- tapOn: 'Train'
- takeScreenshot: .maestro/regression/shots/10-dark-train
- tapOn: 'Trends'
- takeScreenshot: .maestro/regression/shots/10-dark-trends
- tapOn: 'Body'
- takeScreenshot: .maestro/regression/shots/10-dark-body
- tapOn: 'Today'
# ── add sheet ──
- openLink: 'ignia://?openAdd=${NONCE}-10'
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-more'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-sheet
- tapOn:
    id: 'open-more'
- takeScreenshot: .maestro/regression/shots/10-dark-sheet-moreways
- tapOn:
    id: 'entry-backdrop'
# ── back to System — the suite's baseline ──
# Relaunch first: same off-screen-avatar trap as 09's tail.
- launchApp:
    clearState: false
# Wait for the loader to actually GO, the way 20-units-metric does. This flow
# used `assertVisible: 'Today'` alone, which is not a readiness gate at all —
# the tab bar sits UNDER the splash, so the assert passes while the overlay is
# still up and eating taps. Necessary but not sufficient on its own: the splash
# comes BACK at ~3.4s, so the repeat gate below is still required.
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 15000
- assertVisible: 'Today'
# Same swallowed-tap gate as the head — this relaunch re-arms the splash, and
# THIS is where the 2026-08-24 run actually died: the tap was eaten, the flow
# scrolled Today for 60s looking for `settings-theme-system`, and the tail left
# the device stranded in DARK. A restore tail that can be skipped silently is
# worse than no restore tail.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'settings-back'
    commands:
      # optional: the loop re-checks its condition the instant the tap returns,
      # which on this device is mid-navigation — so a second iteration can start
      # after the tap ALREADY worked, by which point `settings-open` is gone with
      # the Today header and a required tap fails the whole flow. Optional makes
      # that harmless: the extra iteration warns, the condition re-reads, done.
      - tapOn:
          id: 'settings-open'
          optional: true
# `repeat` reports COMPLETED when it runs out of iterations, whether or not the
# condition was ever satisfied — it is a bounded retry, not an assertion. Without
# this line a gate that never landed passes silently and the flow dies 60s later
# on the WRONG SCREEN, which is the exact misdirection the gate exists to remove.
# Measured 2026-08-25: that is precisely what happened here on the relaunch.
- assertVisible:
    id: 'settings-back'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# 60s, not 20s — the same LG G6 measurement as 04-settings and 09-locale-es
# (2026-08-23): a scroll from the top of Settings costs tens of seconds on this
# device. This flow failed here on the 2026-08-23 run, and like 09 it leaves
# state behind when it dies — the theme, not the locale.
- scrollUntilVisible:
    element:
      id: 'settings-theme-system'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-theme-system'
- tapOn:
    id: 'settings-back'
- assertVisible: 'Today'
