# Dark-theme pass — the app is dual-theme with dark leading (ADR-0014) and no
# capture had ever run dark. Text assertions are theme-blind, so THE SCREENSHOTS
# ARE THIS FLOW'S ENTIRE VALUE: an invisible-on-dark element still "asserts
# visible". Look at every shot — ink-on-ink text, a light-pinned card, a
# vanished border are what this pass exists to catch.
#
# Theme is per-DEVICE AsyncStorage (not the profile), so a midway failure
# leaves this sandbox dark and every later screenshot dark with it. Recovery:
# re-run this flow, or Settings → Appearance → System by hand. If a later
# flow's shots come out dark, this flow's tail did not run — do not read that
# as "the app went dark on its own".
appId: fit.ignia.app
env:
  NONCE: '0'
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
# ── flip to dark ──
- tapOn:
    id: 'settings-open'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# 60s, not 20s — the same LG G6 measurement as 04-settings and 09-locale-es
# (2026-08-23): a scroll from the top of Settings costs tens of seconds on this
# device. This flow failed here on the 2026-08-23 run, and like 09 it leaves
# state behind when it dies — the theme, not the locale.
- scrollUntilVisible:
    element:
      id: 'settings-theme-dark'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-theme-dark'
- takeScreenshot: .maestro/regression/shots/10-dark-settings
# Wait for the header to come back before reaching for it. Switching the theme
# re-renders the whole screen, and on iOS the tap raced that re-render — flow
# 09 taps this very ID successfully, so the button is addressable; it is the
# repaint that is not instant.
- extendedWaitUntil:
    visible:
      id: 'settings-back'
    timeout: 15000
- tapOn:
    id: 'settings-back'
# ── Today, all three scroll positions ──
- extendedWaitUntil:
    visible: 'Today'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-today-top
- scrollUntilVisible:
    element:
      text: 'Water'
    direction: DOWN
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-today-metrics
- scrollUntilVisible:
    element:
      text: 'Entries'
    direction: DOWN
    timeout: 15000
- scroll
- takeScreenshot: .maestro/regression/shots/10-dark-today-entries
# ── tabs ──
- tapOn: 'Train'
- takeScreenshot: .maestro/regression/shots/10-dark-train
- tapOn: 'Trends'
- takeScreenshot: .maestro/regression/shots/10-dark-trends
- tapOn: 'Body'
- takeScreenshot: .maestro/regression/shots/10-dark-body
- tapOn: 'Today'
# ── add sheet ──
- openLink: 'ignia://?openAdd=${NONCE}-10'
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-more'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/10-dark-sheet
- tapOn:
    id: 'open-more'
- takeScreenshot: .maestro/regression/shots/10-dark-sheet-moreways
- tapOn:
    id: 'entry-backdrop'
# ── back to System — the suite's baseline ──
# Relaunch first: same off-screen-avatar trap as 09's tail.
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn:
    id: 'settings-open'
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# 60s, not 20s — the same LG G6 measurement as 04-settings and 09-locale-es
# (2026-08-23): a scroll from the top of Settings costs tens of seconds on this
# device. This flow failed here on the 2026-08-23 run, and like 09 it leaves
# state behind when it dies — the theme, not the locale.
- scrollUntilVisible:
    element:
      id: 'settings-theme-system'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-theme-system'
- tapOn:
    id: 'settings-back'
- assertVisible: 'Today'
