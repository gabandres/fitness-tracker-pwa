# Coach — entry point and idle state ONLY. Never taps "Ask": every question is
# a metered Gemini call (dailyQuota + spendCeiling), and a suite that spends
# real AI money per run would get turned off. The reply state stays uncovered
# by design; the quota chip in the screenshot is the evidence the meter wired
# up.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn: 'Trends'
- scrollUntilVisible:
    element:
      id: 'coach-entry'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'coach-entry'
- assertVisible: 'Coach'
- assertVisible:
    id: 'coach-input'
- assertVisible:
    id: 'coach-ask'
# The quota chip. It could NOT be asserted here until 2026-08-09 — remaining/
# limit were set only from a consultation's response, so the chip did not exist
# until one was spent, and this flow never asks (metered Gemini). Coach now
# reads the day's quota doc on mount, so the idle screen states the allowance
# and this assert is the regression guard for that read.
#
# extendedWaitUntil, not assertVisible: the count arrives from Firestore.
- extendedWaitUntil:
    visible:
      id: 'coach-remaining'
    timeout: 20000
- takeScreenshot: .maestro/regression/shots/07-coach
- tapOn:
    id: 'coach-back'
- tapOn: 'Today'
- assertVisible: 'Today'
