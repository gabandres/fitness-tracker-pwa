# Coach — entry point and idle state ONLY. Never taps "Ask": every question is
# a metered Gemini call (dailyQuota + spendCeiling), and a suite that spends
# real AI money per run would get turned off. The reply state stays uncovered
# by design; the quota chip in the screenshot is the evidence the meter wired
# up.
appId: fit.ignia.app
---
# ── `scrollUntilVisible` has a documented failure on this suite's Android host,
# and every fallback below exists for it. ──
#
# Measured 2026-08-30 on the LG VS988: the command times out while the target is
# ALREADY ON SCREEN. `07-coach`'s hierarchy at the moment of failure had
# `coach-entry` present, clickable and bounded [96,1881][1344,2068], and that
# run's own screenshot shows the button rendered. It is not making progress, and
# relaxing `visibilityPercentage` does not help — coverage.md records both.
#
# So each call gains `optional: true` plus a bounded swipe loop, which is
# Maestro's own "universal adapter" idiom (docs: recipes/choose-images, and
# recipes/custom-scrolling-for-screen-fragments). The shape is deliberate:
#
#   * It is ADDITIVE. These flows are shared with iOS, where `scrollUntilVisible`
#     works (19 of 21 on 2026-08-24) and where there is no device here to
#     re-validate. If the original command succeeds the loop's `while` is false
#     immediately and it costs nothing, so iOS behaviour cannot change.
#   * `while: notVisible` no-ops when the target is already on screen, which is
#     precisely the Android failure.
#   * `times:` bounds it, so a genuinely missing element still fails the flow —
#     later, on the command that needed it — rather than hanging.
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn: 'Trends'
- scrollUntilVisible:
    element:
      id: 'coach-entry'
    direction: DOWN
    timeout: 15000
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        id: 'coach-entry'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- tapOn:
    id: 'coach-entry'
- assertVisible: 'Coach'
- assertVisible:
    id: 'coach-input'
- assertVisible:
    id: 'coach-ask'
# The quota chip. It could NOT be asserted here until 2026-08-09 — remaining/
# limit were set only from a consultation's response, so the chip did not exist
# until one was spent, and this flow never asks (metered Gemini). Coach now
# reads the day's quota doc on mount, so the idle screen states the allowance
# and this assert is the regression guard for that read.
#
# extendedWaitUntil, not assertVisible: the count arrives from Firestore.
- extendedWaitUntil:
    visible:
      id: 'coach-remaining'
    timeout: 20000
- takeScreenshot: .maestro/regression/shots/07-coach
- tapOn:
    id: 'coach-back'
- tapOn: 'Today'
- assertVisible: 'Today'
