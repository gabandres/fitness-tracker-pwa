# E2E part 3 of 3: DELETE. Requires 11 (and normally 12) to have run.
# EntrySheet's delete has NO confirm dialog — one tap and the row is gone.
# After this flow the admin snapshot must show no "QA E2E Sandwich" entry;
# assertNotVisible alone would also pass on a screen that failed to render.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
# Dismiss the update banner BEFORE scrolling. This one optional tap is what
# closed the suite's longest-standing iOS red — see the block above the
# `entry-delete` wait for the full measurement. `optional: true` still WAITS
# for the element (~17s) before giving up, which is what makes it work: the
# banner is fetched asynchronously and lands a few seconds after Today does,
# so a non-waiting check would race past it and dismiss nothing.
- tapOn:
    id: 'store-update-dismiss'
    optional: true
# visibilityPercentage: 60 — the default is 100, and on iOS the newest diary
# row lands partly under the FAB/tab bar, so it is never 100% visible and the
# scroll fails even though the row is on screen and IN FIRESTORE (verified with
# qa-regression-verify.mjs when this first failed). Android's taller list
# happened to clear the FAB, which is why the same line passed there.
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# '.*QA E2E Sandwich.*', not the bare string: iOS merges a diary ROW into a
# single accessibility element whose label is the whole row
# ("QA E2E Sandwich, 11:45 AM · P 9g, 123"), so the label is not its own node
# and Maestro's full-match text selector cannot match it. Android keeps the
# Texts separate, which is why the bare string worked there. Same mechanism as
# the icon-button merge documented in 02-add-sheet. Measured 2026-08-09 from a
# capture showing the row plainly on screen while the assert failed.
#
# NO centerElement here, deliberately: the newest row is the LAST item, the
# list cannot scroll further to centre it, and Maestro then keeps swiping
# until it times out — again with the row plainly on screen. Centering is for
# targets mid-list (the Settings toggles); visibilityPercentage is what makes
# an end-of-list row reachable.
- scrollUntilVisible:
    element:
      text: '.*QA E2E Sandwich.*'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- tapOn:
    text: '.*QA E2E Sandwich.*'
# SOLVED 2026-08-18 — this was the suite's one standing iOS red, and it was
# never an app defect, never a long-press, and never the preset chip.
#
# The failure signature was misread for nine days. It is NOT "the tap lands
# and no sheet opens": the `scrollUntilVisible` above SUCCEEDS, and then the
# tap fails with *element not found*, because between the two commands the
# row leaves the accessibility tree entirely. The hierarchy Maestro dumps on
# failure contains `Entries`, `Breakfast` and `321 kcal` — and no node
# carrying the row's name anywhere.
#
# What moves it: the **"New version available" banner**. Every QA build is
# CFBundleVersion 1, so it is permanently older than the shipped store
# version, and Today renders the banner as soon as its async version fetch
# returns. That re-render lands mid-flow and puts the list back at the top —
# the failure capture is Today scrolled to the very top with the banner
# across it. `tapOn` does not scroll, so it then spent 17s querying a tree
# the row was no longer in.
#
# Why it looked iOS-only: nothing about the mechanism is. It is a race, and
# the banner simply landed inside iOS's slower scroll→tap window every time.
# Flows 11, 12 and 14 dismiss it now too, for the same reason — they were
# passing on timing, not on correctness.
#
# The earlier eliminations still stand and are still worth keeping: only one
# node ever matched the regex, and flow 12's identical tap does open the
# editor. Both were true. They just were not the question.
- extendedWaitUntil:
    visible:
      id: 'entry-delete'
    timeout: 15000
- tapOn:
    id: 'entry-delete'
- assertNotVisible: '.*QA E2E Sandwich.*'
- takeScreenshot: .maestro/regression/shots/13-e2e-deleted
