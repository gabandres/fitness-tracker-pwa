# Food search — results list + serving detail, RENDER ONLY. Nothing is added:
# a USDA hit's macros are not deterministic across dataset updates, and the QA
# ledger stays clean. (The write path is already proven end-to-end by 11–13.)
#
# This talks to the real searchFoods callable (no AI, no quota) — a dead
# network fails here first; that is a feature, not flake: nothing else in the
# suite proves the callable path at all.
#
# Maestro text params are full-match regexes, hence the '.*banana.*' shape.
appId: fit.ignia.app
env:
  NONCE: '0'
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- openLink: 'ignia://?openAdd=${NONCE}-15'
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-more'
    timeout: 15000
- tapOn:
    id: 'food-search-input'
- inputText: 'banana'
# Results must contain a HIT, not just the query echoed back: '.*banana.*'
# would match the search input's own text, so anchor on the raw-food naming
# only a USDA row carries.
- extendedWaitUntil:
    visible: '.*[Bb]anana.*raw.*'
    timeout: 20000
# The keyboard is deliberately left UP. `hideKeyboard` throws on iOS, and the
# usual workaround — tapping a non-interactive label — has no target here:
# once results render they REPLACE the Recent/Quick-add sections whose
# headings would have served (measured 2026-08-09: '.*RECENT.*' not found,
# because by then it genuinely is not on screen). The results list sits above
# the keyboard, so the tap below lands fine, and the capture showing the
# keyboard is honest about the state.
- takeScreenshot: .maestro/regression/shots/15-search-results
# Serving detail: tap the USDA-named row (the input can't match this regex).
- tapOn:
    text: '.*[Bb]anana.*raw.*'
# '.*Add.*': each serving row merges its label, macros and the Add affordance
# into ONE accessibility element on iOS, so the bare word is not its own node
# (same merge as the diary rows — see 11-e2e-log).
- extendedWaitUntil:
    visible: '.*Add.*'
    timeout: 20000
- takeScreenshot: .maestro/regression/shots/15-search-detail
# The serving-detail view fills the sheet, so the backdrop is unreachable and
# there is no cross-platform dismiss from here (`back` is Android-only).
# Relaunch to hand the next flow a clean Today.
- launchApp:
    clearState: false
- assertVisible: 'Today'
