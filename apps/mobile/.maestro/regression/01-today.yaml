# Today — the home screen: hero rings, daily metrics, entries list.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- takeScreenshot: .maestro/regression/shots/01-today-top
# The metrics card. FASTING/WATER labels are uppercase in the UI but Maestro
# matches case-insensitively on text.
- scrollUntilVisible:
    element:
      text: 'Water'
    direction: DOWN
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/01-today-metrics
- scrollUntilVisible:
    element:
      text: 'Entries'
    direction: DOWN
    timeout: 15000
# Scroll to the END before the final shot — a mid-scroll capture put "Repeat
# yesterday" visually under the FAB and read as an occlusion bug when it is not.
- scroll
- takeScreenshot: .maestro/regression/shots/01-today-entries
