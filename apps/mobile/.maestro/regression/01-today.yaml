# Today — the home screen: hero rings, daily metrics, entries list.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
# `Today` alone is NOT enough to know the screen has rendered: it is also the
# TAB BAR's label, and the tab bar is in the accessibility tree while the
# BrandLoader splash is still painted over the whole screen. Measured
# 2026-08-18 — 01-today-top and 01-today-metrics both captured the splash, so
# two of this flow's three pieces of evidence showed the wordmark and nothing
# else, and the run still went green. Wait for something only the loaded
# screen has.
# Waiting for a Today element is NOT enough either — tried and measured the
# same day: the BrandLoader is an OVERLAY the root layout paints on top, so
# every Today node (`hero-rings` included) is already in the tree beneath it
# and the capture still came back as the wordmark. Wait for the loader to go.
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/01-today-top
# The metrics card. FASTING/WATER labels are uppercase in the UI but Maestro
# matches case-insensitively on text.
# centerElement, added 2026-09-22. WITHOUT it this scroll SUCCEEDS WITHOUT
# MOVING: the metrics card peeks above the fold, Maestro counts the label as
# visible, and the capture is taken from the unscrolled position — so
# `*-today-metrics.png` came out BYTE-IDENTICAL to `*-today-top.png` in all
# three variants (sha1-verified 2026-09-22). coverage.md had therefore been
# claiming a reviewed capture of the metrics card that no run ever took.
- scrollUntilVisible:
    element:
      text: 'Water'
    direction: DOWN
    timeout: 15000
    centerElement: true
- takeScreenshot: .maestro/regression/shots/01-today-metrics
- scrollUntilVisible:
    element:
      text: 'Entries'
    direction: DOWN
    timeout: 15000
# Scroll to the END before the final shot — a mid-scroll capture put "Repeat
# yesterday" visually under the FAB and read as an occlusion bug when it is not.
- scroll
- takeScreenshot: .maestro/regression/shots/01-today-entries
