# Train vocabulary: the glossary sheet, the labelled RIR scale, and the
# described set-type rows.
#
# Closes the "Workout logging (Train interactions)" gap coverage.md has carried
# as the largest remaining one. It is also the only flow that can prove this
# particular change, because the whole point of it is TEXT A USER CAN READ:
# a jest test asserting `getByText('0 · to failure')` passes whether or not the
# picker ever opens on screen, and the picker is a panel that unfolds under a
# set row — exactly the layout that this directory exists to catch.
#
# STATE: this flow starts a workout and adds a catalog exercise. Both are
# cleaned up in its own tail (discard, then delete the exercise), so it leaves
# the account as it found it. If a run dies mid-flow, "QA Term Check" is the
# marker to look for — delete it from Train → Exercises, and discard any
# workout left in progress from the Train tab.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- tapOn: 'Train'

# ── 1. The glossary, straight off the tab header ──────────────────
- tapOn:
    id: 'train-glossary-open'
- assertVisible: 'Training terms'
# The term a user actually asked about, spelled out rather than abbreviated.
# Both headings lead with what the COLUMN says and keep the jargon in
# parentheses (2026-08-18): the RIR column header is now "LEFT", and a
# cluster's rows are numbered 1a/1b/1c rather than C1/C2.
- assertVisible: 'LEFT — reps in reserve (RIR)'
- assertVisible: 'Cluster (1a, 1b, 1c)'
- takeScreenshot: .maestro/regression/shots/16-glossary-top
# The sheet's own ScrollView is capped (maxHeight) so the later sections are
# BELOW the fold by design — scrolling to them is the assertion that the cap
# scrolls rather than clips.
#
# Both checks are scrollUntilVisible, which fails on its own if the term never
# appears — NOT a scroll followed by assertVisible on a neighbouring term.
# scrollUntilVisible stops the instant its target enters the viewport, so
# whether the NEXT term down is also on screen is luck: `assertVisible: Volume`
# after scrolling to e1RM passed on one run and failed on the next with the
# glossary rendering perfectly both times.
- scrollUntilVisible:
    element:
      text: 'e1RM'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 60
# The last term of the last section — reaching it proves the whole sheet
# scrolls rather than clipping at its maxHeight.
- scrollUntilVisible:
    element:
      text: 'Warm-up %'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 60
- takeScreenshot: .maestro/regression/shots/16-glossary-bottom
# Dismissing this sheet needs a DIFFERENT command per platform — measured
# 2026-08-18, on this flow's first-ever iOS run.
#
# `- back` dismissed it on Android and does nothing at all on iOS: there is no
# hardware back there, so Maestro sends a left-edge swipe, which the router
# honours for a pushed SCREEN (this is why `back` still works in 04-settings
# and 05-history) and which a `Modal`-hosted BottomSheet never sees. The flow
# then asserted "Train" with the glossary still over it — and the capture
# shows a perfectly rendered sheet, so it reads as an app bug and is not one.
#
# Two things that look like the fix and are not, both tried and measured here:
#   - the backdrop's `testID`: it is an `absoluteFill` Pressable BEHIND the
#     sheet, and Maestro taps the centre of an element's bounds, which is the
#     middle of the screen — i.e. on the sheet;
#   - a `swipe` from the grab strip the component's own PanResponder listens
#     to (dy > 120 or vy > 0.8 closes). The gesture ran, the strip was found,
#     and the sheet did not move.
#
# So: a point tap on the backdrop, above where the sheet's top edge can reach.
# This is the documented exception to "never tap by coordinates on a signed-in
# account" — that rule exists because a missed tap once logged a real entry,
# and here the point is over a modal backdrop whose only fallback target, if
# the sheet were somehow already closed, is the non-interactive Train header.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '50%, 12%'
- assertVisible: 'Train'

# ── 2. A set row, and the two pickers on it ───────────────────────
# A previous run that died mid-flow leaves a session in progress, and then
# `start-workout` is not on screen at all — the whole rest of the flow fails
# for a reason that has nothing to do with what it tests. Clear it first.
- runFlow:
    when:
      visible:
        id: 'discard-workout'
    commands:
      - tapOn:
          id: 'discard-workout'
      - extendedWaitUntil:
          visible:
            id: 'start-workout'
          timeout: 15000
- tapOn:
    id: 'start-workout'
- extendedWaitUntil:
    visible:
      id: 'add-exercise'
    timeout: 15000
- tapOn:
    id: 'add-exercise'
- tapOn:
    id: 'exercise-name'
- inputText: 'QA Term Check'
# Tap the sheet's own title first — the keyboard is up, and Maestro taps an
# element's LAYOUT bounds, so a create-row tap would otherwise land on the
# keyboard (the same failure documented in 14-metrics).
- tapOn: 'Add exercise'
- tapOn:
    id: 'create-exercise'
# A new exercise arrives with exactly one set, kind `working`, so the RIR cell
# is on screen without adding anything.
- extendedWaitUntil:
    visible:
      id: 'set-rir-0-0'
    timeout: 15000
- takeScreenshot: .maestro/regression/shots/16-set-row

# RIR: the cell used to be a bare 0–5 number box. Tapping it must now open a
# scale that says what each number MEANS — including that 0 is the hard end,
# which is the half users get backwards.
- tapOn:
    id: 'set-rir-0-0'
# Anchor on a chip that exists ONLY while the picker is open.
#
# This line used to read `assertVisible: 'How many more reps could you have
# done?'` and it was a FALSE POSITIVE on iOS — it passed whether or not the
# picker opened. Two facts combined: the picker's own header renders
# UPPERCASE, and the CELL carried that same sentence mixed-case as its
# accessibility label, because iOS merges a touchable's content into one
# label. So the assert matched the closed cell every time. It surfaced on
# 2026-08-18, when the cell's label gained its current value and stopped
# being an exact match — the assert failed on a run where the hierarchy dump
# showed all seven picker chips plainly present.
#
# `set-rir-0-0-none` is rendered by the picker and by nothing else, so it
# cannot pass against a closed cell. The three chip labels below are the
# content assertions; this one is the state assertion.
- assertVisible:
    id: 'set-rir-0-0-none'
- assertVisible: '0 · to failure'
- assertVisible: '5+ · easy'
- assertVisible: 'Not tracking'
- takeScreenshot: .maestro/regression/shots/16-rir-scale
- tapOn:
    id: 'set-rir-0-0-2'
# The picker closes and the cell carries the chosen value.
#
# `containsChild`, not `id` + `text` on one node: the testID is on the
# TouchableOpacity and the value lives in its Text CHILD, so a combined
# id+text selector matches nothing and reads as a regression. Measured
# 2026-08-12 from the hierarchy dump — `set-rir-0-0` has empty text and a
# child node holding '2'. A bare `text: '2'` would be the other wrong answer:
# the set row is full of small integers, so it would pass against the set
# number while the RIR cell stayed empty.
#
# iOS needs a DIFFERENT assertion, and finding out why produced an app fix.
# iOS merges a touchable's Text child into the touchable's own accessibility
# label, so there is no child node to contain anything — measured 2026-08-18,
# where the dump showed `set-rir-0-0` carrying only the prompt string and no
# number anywhere in the tree, on a set whose RIR was visibly 2. The value was
# not merely hard to select: it was **not exposed at all**, which is a real
# VoiceOver defect (the cell announced its question and never its answer).
# The cell now puts the value in its own label, so this asserts it directly.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'set-rir-0-0'
          containsChild:
            text: '2'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: 'set-rir-0-0'
          text: '.*2.*'
- takeScreenshot: .maestro/regression/shots/16-rir-picked

# Set types: "Activation" and "Mini" are cluster-training words. The picker is
# now rows-with-descriptions, so the description text is the assertion.
- tapOn:
    id: 'set-kind-0-0'
- assertVisible: 'Set type'
# Regex, not the bare sentence. Each row of this picker is a title plus a
# description, and iOS merges them into ONE label — measured 2026-08-18:
# `set-kind-0-0-working` reads "Working, A real, hard set — the default.".
# A full-match text selector cannot match a description that is only part
# of its row's label. Android keeps the two Texts separate, and `.*…` still
# matches there, so one regex serves both platforms.
- assertVisible: '.*A real, hard set.*'
- assertVisible: '.*First hard set of a cluster.*'
- takeScreenshot: .maestro/regression/shots/16-set-types
- tapOn:
    id: 'set-kind-0-0-working'

# ── 3. Teardown: leave the account as we found it ─────────────────
- scrollUntilVisible:
    element:
      id: 'discard-workout'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: 'discard-workout'
- extendedWaitUntil:
    visible:
      id: 'start-workout'
    timeout: 15000
# The catalog entry outlives the session — remove it from the Exercises list so
# the next run starts clean and no QA name leaks into a screenshot.
# Regex, for the third time in this flow and the same reason: iOS merges a
# catalog ROW into one label, so the bare name is not a node. Measured
# 2026-08-18 — the session header read "QA Term Check, 0/1, " and the
# catalog row is the same shape. `13-e2e-delete` matches its diary row the
# same way. A teardown that cannot find its own row leaves the QA name in
# the account, and the next run's screenshots inherit it.
- scrollUntilVisible:
    element:
      text: '.*QA Term Check.*'
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: '.*QA Term Check.*'
- tapOn:
    id: 'exercise-delete'
- tapOn:
    id: 'exercise-delete-confirm'
- takeScreenshot: .maestro/regression/shots/16-teardown
