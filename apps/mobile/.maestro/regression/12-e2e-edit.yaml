# E2E part 2 of 3: LONG-PRESS → PRESET, then EDIT. Requires 11 to have run.
#
# The preset half: a diary row's long-press offers "save as preset" — the alert
# is the assert; the preset doc itself is verified (and DELETED, so runs don't
# stack presets toward the cap) by the admin script between flows:
#   node scripts/qa-regression-verify.mjs snapshot   → presets: ["QA E2E Sandwich"]
#   node scripts/qa-regression-verify.mjs cleanup    → removes it
#
# The edit half rewrites calories 123 → 321. After this flow the snapshot must
# read calories: 321 — that, not the on-screen "321", is the proof the PATCH
# landed.
appId: fit.ignia.app
---
# ── `scrollUntilVisible` has a documented failure on this suite's Android host,
# and every fallback below exists for it. ──
#
# Measured 2026-08-30 on the LG VS988: the command times out while the target is
# ALREADY ON SCREEN. `07-coach`'s hierarchy at the moment of failure had
# `coach-entry` present, clickable and bounded [96,1881][1344,2068], and that
# run's own screenshot shows the button rendered. It is not making progress, and
# relaxing `visibilityPercentage` does not help — coverage.md records both.
#
# So each call gains `optional: true` plus a bounded swipe loop, which is
# Maestro's own "universal adapter" idiom (docs: recipes/choose-images, and
# recipes/custom-scrolling-for-screen-fragments). The shape is deliberate:
#
#   * It is ADDITIVE. These flows are shared with iOS, where `scrollUntilVisible`
#     works (19 of 21 on 2026-08-24) and where there is no device here to
#     re-validate. If the original command succeeds the loop's `while` is false
#     immediately and it costs nothing, so iOS behaviour cannot change.
#   * `while: notVisible` no-ops when the target is already on screen, which is
#     precisely the Android failure.
#   * `times:` bounds it, so a genuinely missing element still fails the flow —
#     later, on the command that needed it — rather than hanging.
- launchApp:
    clearState: false
- assertVisible: 'Today'
# The "New version available" banner re-renders Today asynchronously and puts
# the list back at the top mid-flow — the mechanism written up in full in
# 13-e2e-delete.yaml, where it was the standing iOS red. Every QA build is
# CFBundleVersion 1, so the banner always fires here. Dismiss it before
# touching the list. `optional: true` still WAITS for it, which is the point.
- tapOn:
    id: 'store-update-dismiss'
    optional: true
# visibilityPercentage: 60 — the default is 100, and on iOS the newest diary
# row lands partly under the FAB/tab bar, so it is never 100% visible and the
# scroll fails even though the row is on screen and IN FIRESTORE (verified with
# qa-regression-verify.mjs when this first failed). Android's taller list
# happened to clear the FAB, which is why the same line passed there.
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# '.*QA E2E Sandwich.*', not the bare string: iOS merges a diary ROW into a
# single accessibility element whose label is the whole row
# ("QA E2E Sandwich, 11:45 AM · P 9g, 123"), so the label is not its own node
# and Maestro's full-match text selector cannot match it. Android keeps the
# Texts separate, which is why the bare string worked there. Same mechanism as
# the icon-button merge documented in 02-add-sheet. Measured 2026-08-09 from a
# capture showing the row plainly on screen while the assert failed.
#
# NO centerElement here, deliberately: the newest row is the LAST item, the
# list cannot scroll further to centre it, and Maestro then keeps swiping
# until it times out — again with the row plainly on screen. Centering is for
# targets mid-list (the Settings toggles); visibilityPercentage is what makes
# an end-of-list row reachable.
- scrollUntilVisible:
    element:
      text: '.*QA E2E Sandwich.*'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        text: '.*QA E2E Sandwich.*'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
# Scroll to the END before touching the row. scrollUntilVisible stops the
# moment the row enters the viewport, which is often UNDER the FAB — and
# Maestro taps layout bounds, so the touch goes to the FAB on top and opens the
# speed dial instead (measured 2026-08-09). Same species as the README's
# "Repeat yesterday" false alarm; here it broke the flow rather than a shot.
- scroll
# ── preset via long-press ──
- longPressOn:
    text: '.*QA E2E Sandwich.*'
# Trailing .* because Maestro text is a full-match regex and the title ends
# with a literal '?' — a bare '?' would quantify the 't' and never match.
- assertVisible: 'Save as a quick-add preset.*'
- takeScreenshot: .maestro/regression/shots/12-e2e-preset-alert
- tapOn: 'Save preset'
# ── edit via row tap ──
# Tapping the row by its accessibility text. The row is ONE element on iOS —
# `{text: "", accessibilityText: "QA E2E Sandwich, 1:05 PM · P 9g, 123",
# resource-id: "entry-<docId>"}` — which is why the substring regex is needed
# and why a bare 'QA E2E Sandwich' cannot match.
- tapOn:
    text: '.*QA E2E Sandwich.*'
- assertVisible:
    id: 'entry-calories'
- tapOn:
    id: 'entry-calories'
- eraseText
- inputText: '321'
# Tap the sheet title rather than hideKeyboard — see 11-e2e-log's note.
# This sheet is in EDIT mode, so its title differs.
- tapOn: 'Edit entry'
- takeScreenshot: .maestro/regression/shots/12-e2e-edit
- tapOn:
    id: 'entry-save'
# visibilityPercentage: 60 — the default is 100, and on iOS the newest diary
# row lands partly under the FAB/tab bar, so it is never 100% visible and the
# scroll fails even though the row is on screen and IN FIRESTORE (verified with
# qa-regression-verify.mjs when this first failed). Android's taller list
# happened to clear the FAB, which is why the same line passed there.
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
- scrollUntilVisible:
    element:
      text: '.*QA E2E Sandwich.*'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    optional: true
- repeat:
    times: 10
    while:
      notVisible:
        text: '.*QA E2E Sandwich.*'
    commands:
      - swipe:
          start: 10%, 80%
          end: 10%, 45%
- takeScreenshot: .maestro/regression/shots/12-e2e-edited
