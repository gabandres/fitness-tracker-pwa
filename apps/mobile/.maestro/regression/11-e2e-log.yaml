# E2E part 1 of 3: WRITE. Logs a food through the manual sheet and asserts it
# renders in Entries. Parts 11→12→13 are a sequence (log → edit+preset →
# delete) and run in that order in a directory run; 12 and 13 fail standalone
# because their row does not exist yet.
#
# The label is deliberately unmistakable: if "QA E2E Sandwich" ever shows up in
# a screenshot outside these three flows, a run died between 11 and 13 — clean
# it with: node scripts/qa-regression-verify.mjs cleanup --email <qa email>
#
# The on-screen assert is HALF the evidence. The other half is a ground-truth
# admin read between flows: node scripts/qa-regression-verify.mjs snapshot
# must show {label: "QA E2E Sandwich", calories: 123, protein: 9} after this
# flow. The UI can lie (optimistic render); Firestore cannot.
appId: fit.ignia.app
env:
  NONCE: '0'
---
- launchApp:
    clearState: false
- assertVisible: 'Today'
- openLink: 'ignia://?openAdd=${NONCE}-11'
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-more'
    timeout: 15000
- tapOn:
    id: 'open-manual'
- tapOn:
    id: 'entry-label'
- inputText: 'QA E2E Sandwich'
- tapOn:
    id: 'entry-calories'
- inputText: '123'
- tapOn:
    id: 'entry-protein'
- inputText: '9'
# `hideKeyboard` is a KNOWN iOS FLAKE — iOS exposes no native dismiss API, so
# Maestro fakes it by scrolling and then fails when the keyboard is still up
# (Maestro's own known-issues page says so, and it failed here on the numeric
# keypad, which has no return key). The documented workaround is to tap a
# non-interactive element; the sheet's own title is exactly that.
- tapOn: 'Add food'
- takeScreenshot: .maestro/regression/shots/11-e2e-filled
- tapOn:
    id: 'entry-save'
# Sheet closes; the row lands in Entries (scroll — Entries sits below metrics).
# visibilityPercentage: 60 — the default is 100, and on iOS the newest diary
# row lands partly under the FAB/tab bar, so it is never 100% visible and the
# scroll fails even though the row is on screen and IN FIRESTORE (verified with
# qa-regression-verify.mjs when this first failed). Android's taller list
# happened to clear the FAB, which is why the same line passed there.
# centerElement: true — scrollUntilVisible stops as soon as the element enters
# the viewport, which on iOS routinely leaves it UNDER the tab bar; Maestro then
# taps its layout bounds and the touch goes to whatever is on top. Measured
# 2026-08-09: this exact line put the run on the Trends tab instead of toggling
# the theme. Centering moves the target clear of both bars.
# '.*QA E2E Sandwich.*', not the bare string: iOS merges a diary ROW into a
# single accessibility element whose label is the whole row
# ("QA E2E Sandwich, 11:45 AM · P 9g, 123"), so the label is not its own node
# and Maestro's full-match text selector cannot match it. Android keeps the
# Texts separate, which is why the bare string worked there. Same mechanism as
# the icon-button merge documented in 02-add-sheet. Measured 2026-08-09 from a
# capture showing the row plainly on screen while the assert failed.
#
# NO centerElement here, deliberately: the newest row is the LAST item, the
# list cannot scroll further to centre it, and Maestro then keeps swiping
# until it times out — again with the row plainly on screen. Centering is for
# targets mid-list (the Settings toggles); visibilityPercentage is what makes
# an end-of-list row reachable.
- scrollUntilVisible:
    element:
      text: '.*QA E2E Sandwich.*'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- takeScreenshot: .maestro/regression/shots/11-e2e-logged
