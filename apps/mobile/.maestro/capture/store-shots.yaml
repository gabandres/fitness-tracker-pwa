# App Store screenshot capture: the frames of docs/app-store-metadata.md §3,
# taken on an iPhone 16 Pro Max simulator. Its 1320 × 2868 native size is
# exactly the 6.9" slot Apple wants, so nothing is scaled afterwards.
#
# Re-shot 2026-11-08 (v2). Each change fixes something the 2026-09-05 set got wrong:
#   - Train ticks two sets, so the frame shows a session being LOGGED.
#     v1 showed every rep as 0, "0 of 3 done", which reads as an empty form.
#   - The add sheet is shot with a search and NO keyboard. In v1 the
#     keyboard covered half the frame.
#   - Body (the weight trend) replaces Settings as frame 5. v1's last frame was
#     a plain list of settings rows.
#   - The theme is set explicitly by THEME (dark|light), so a set can't mix
#     themes by accident.
#
# Run once per locale, signed in as demo@ignia.fit. Never use review@, which App
# Review signs in with. Before each run, seed the account:
#
#   node scripts/seed-demo-account.mjs --email demo@ignia.fit --reset --any-hour
#
# and flip the locale with an admin write, not the Settings toggle:
#
#   node scripts/qa-regression-verify.mjs set-locale --email demo@ignia.fit --locale es-PR
#
#   maestro test .maestro/capture/store-shots.yaml -e OUT=en -e THEME=dark \
#     -e SEARCH='chicken breast' -e SEARCH_RE='.*[Cc]hicken.*' \
#     -e EMAIL=demo@ignia.fit -e PASSWORD="$(cat ~/demo-pass.txt)"
#
# Shot ORDER is not frame order. Trends and Body are shot before the workout
# starts, because the in-progress pill ("Upper A · Resume") sits over every
# tab once it does. Frame numbers come from the file names (store-screenshots.mjs).
#
# Every value goes on the command line, because Maestro 2.8 lets a flow's own
# `env:` block override `-e`. OUT must be RELATIVE: frames land under
# ~/.maestro/tests/<run>/…/takeScreenshot/<OUT>/.
#
# Tabs are tapped by `tab-<route>` id. Those ids resolve on iOS since
# 2026-09-17, and unlike the labels they don't change with the locale.
#
# Frame 2 STARTS a workout from the seeded "Upper A" template and leaves it in
# progress. Clear it before the next run (Discard in the app, or delete the
# session doc and reinstall). A run that finds it open would tick the same
# sets again, which UNticks them.
appId: fit.ignia.app
---
# Sign-in is inline rather than `runFlow: ../android-signin.yaml`. On a fresh
# iOS 27 simulator (2026-11-08) that flow's tap on `password` did not move
# focus, so the password was appended to the email field. Lowering the
# keyboard (tap the flame) between the fields fixes it.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'welcome-signin'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-signin'
    commands:
      - tapOn:
          id: 'welcome-signin'
- extendedWaitUntil:
    visible:
      id: 'signin-submit'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'signin-submit'
    commands:
      - tapOn:
          id: 'email'
      - eraseText: 80
      - inputText: ${EMAIL}
      - tapOn:
          id: 'flame'
      - tapOn:
          id: 'password'
      - eraseText: 80
      - inputText: ${PASSWORD}
      - tapOn:
          id: 'flame'
      - tapOn:
          id: 'signin-submit'
      - tapOn:
          text: 'Not Now'
          optional: true
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'tour-skip'
    commands:
      - tapOn:
          id: 'tour-skip'
- extendedWaitUntil:
    visible:
      id: 'settings-open'
    timeout: 60000

# ── Theme ──
# Theme is per-device AsyncStorage. 10-theme-dark.yaml explains each of these gates.
- repeat:
    times: 8
    while:
      notVisible:
        id: 'settings-daily-targets'
    commands:
      - tapOn:
          id: 'settings-open'
          optional: true
- assertVisible:
    id: 'settings-daily-targets'
- scrollUntilVisible:
    element:
      id: 'settings-theme-${THEME}'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-theme-${THEME}'
- extendedWaitUntil:
    visible:
      id: 'BackButton'
    timeout: 15000
- tapOn:
    id: 'BackButton'
- extendedWaitUntil:
    visible:
      id: 'settings-open'
    timeout: 30000

# One-time cards that would sit over the hero: none of them is what a frame sells.
- tapOn:
    id: 'store-update-dismiss'
    optional: true
- tapOn:
    id: 'recalibration-ack'
    optional: true
- tapOn:
    id: 'whats-new-continue'
    optional: true

# ── 1. Today ──
- extendedWaitUntil:
    visible: '.*kcal.*'
    timeout: 30000
- takeScreenshot: ${OUT}/01-today

# ── 4. Trends ──
- tapOn:
    id: 'tab-trends'
- extendedWaitUntil:
    visible: '.*kcal.*'
    timeout: 30000
- takeScreenshot: ${OUT}/04-trends

# ── 5. Body: the weight trend ──
- tapOn:
    id: 'tab-body'
- extendedWaitUntil:
    visible:
      id: 'body-hero'
    timeout: 30000
- takeScreenshot: ${OUT}/05-body

# ── 2. Train: a session in progress, two sets ticked ──
- tapOn:
    id: 'tab-train'
- extendedWaitUntil:
    visible:
      id: 'train-hero'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'start-template-demo-template-upper'
    commands:
      - tapOn:
          id: 'start-template-demo-template-upper'
- extendedWaitUntil:
    visible:
      id: 'set-done-0-0'
    timeout: 30000
# Ticking accepts the target reps and carries last time's load (SetRow), so a
# tick is the whole act of logging a set. RIR is picked first, because a ticked
# set without one shows an amber "RIR missing" nudge. The first tick opens the
# rest-notification prompt once per device; "Not now" leaves it for later.
- tapOn:
    id: 'set-rir-0-0'
- tapOn:
    id: 'set-sheet-rir-2'
- tapOn:
    id: 'set-done-0-0'
- tapOn:
    id: 'rest-notify-not-now'
    optional: true
- tapOn:
    id: 'set-rir-0-1'
- tapOn:
    id: 'set-sheet-rir-1'
- tapOn:
    id: 'set-done-0-1'
- tapOn:
    id: 'rest-notify-not-now'
    optional: true
- takeScreenshot: ${OUT}/02-train

# ── 3. Add food: a search with the keyboard down ──
# The sheet focuses the field on open, so an "unopened" frame has the
# keyboard over half of it. Only the search is shot.
- openLink: 'ignia://?openAdd=store-2'
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'food-search-input'
    timeout: 20000
- tapOn:
    id: 'food-search-input'
- inputText: ${SEARCH}
- extendedWaitUntil:
    visible: ${SEARCH_RE}
    timeout: 45000
# iOS has no native keyboard dismiss, and Maestro's hideKeyboard only fakes
# one with a scroll. Pressing Return submits the field and lowers the keyboard.
- pressKey: Enter
- takeScreenshot: ${OUT}/03-search

