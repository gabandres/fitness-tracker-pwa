# Last three screens: Milestones + Feedback (via Settings rows), Coach (via
# the Trends "Ask the Coach" button). Read-only.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 15000
- assertVisible: 'Today'
# Gated on Settings' first row: `settings-back` renders only on a cold open
# since S21-1 (2026-10-06, `OrphanBack`).
- repeat:
    times: 8
    while:
      notVisible:
        id: 'settings-daily-targets'
    commands:
      - tapOn:
          id: 'settings-open'
          optional: true
- assertVisible:
    id: 'settings-daily-targets'
- scrollUntilVisible:
    element:
      id: 'settings-milestones'
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-milestones'
- takeScreenshot: .maestro/capture/shots/h1-milestones
# Milestones and Settings are both root-stack screens since S21-1, so back lands
# on Settings every time — still scrolled to Milestones, and Feedback is ABOVE it
# (S21-4 order), hence UP. Native header back: iOS `BackButton`, Android
# hardware back (05-history's convention).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'BackButton'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element:
      id: 'settings-feedback'
    direction: UP
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'settings-feedback'
- takeScreenshot: .maestro/capture/shots/h2-feedback
- launchApp:
    clearState: false
- extendedWaitUntil:
    notVisible:
      id: 'brand-loader'
    timeout: 15000
- tapOn: 'Trends'
- scrollUntilVisible:
    element:
      text: 'Ask the Coach'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: 'Ask the Coach'
- takeScreenshot: .maestro/capture/shots/h3-coach
- launchApp:
    clearState: false
- assertVisible: 'Today'
