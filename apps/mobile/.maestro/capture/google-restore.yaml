# Put a device back on its owner's Google account after a QA sign-in.
# Signed-out entry → welcome intro → "I already have an account" → Continue
# with Google → the Play Services account picker → the named account.
#
#   maestro test .maestro/capture/google-restore.yaml -e ACCOUNT=someone@gmail.com
#
# The picker is a system sheet, so the account row is matched by its email
# text. If the device holds one Google account, GMS may skip the picker and sign
# straight in — every picker step is optional for that reason.
appId: fit.ignia.app
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'welcome-signin'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-signin'
    commands:
      - tapOn:
          id: 'welcome-signin'
- extendedWaitUntil:
    visible:
      id: 'signin-google'
    timeout: 20000
- tapOn:
    id: 'signin-google'
- extendedWaitUntil:
    visible: '.*${ACCOUNT}.*'
    timeout: 20000
    optional: true
- tapOn:
    text: '.*${ACCOUNT}.*'
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 60000
