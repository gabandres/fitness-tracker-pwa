<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ignia — how many calories do I have left today?</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Light-paper default; app.ts swaps this per theme (dark/sepia/…)
         at runtime so the browser chrome always matches the palette. -->
    <meta name="theme-color" content="#f2ead7" />
    <!-- iOS Safari smart banner → the App Store listing. Only renders in
         mobile Safari (not in the installed PWA), so it upsells the native
         app to web visitors without touching the standalone experience.
         `app-id` is the ASC app ID, mirrored in apps/mobile/eas.json. -->
    <meta name="apple-itunes-app" content="app-id=6788589414, app-argument=https://ignia.fit/" />

    <!-- Search + social preview. og:image lives at /og-image.png (1200×630).
         Generate via `sharp` at build time — see scripts/og-image.ts. -->
    <meta name="description" content="A quiet, private calorie + protein log with AI coaching and a real lifting log. Measured TDEE from your own data. Free on iPhone and Android. No ads. No data selling." />
    <link rel="canonical" href="https://ignia.fit/" />
    <!-- Homepage language pair. Every other URL gets its own set written by
         scripts/prerender-seo.mjs, which strips these first — the shell is
         copied for each generated page, so leaving both would give every
         page two conflicting hreflang sets. -->
    <link rel="alternate" hreflang="en" href="https://ignia.fit/" />
    <link rel="alternate" hreflang="es" href="https://ignia.fit/es/" />
    <link rel="alternate" hreflang="x-default" href="https://ignia.fit/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ignia" />
    <!-- The EN homepage IS this shell (prerender-seo.mjs deliberately does not
         rewrite index.html — that would break the SPA fallback), so og:locale
         has to be declared here or `/` is the one URL that ships without it.
         Every generated page gets its own value written over this one. -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Ignia — how many calories do I have left today?" />
    <meta property="og:description" content="A quiet, private calorie + protein log with AI coaching. Measured TDEE from your own data." />
    <meta property="og:url" content="https://ignia.fit/" />
    <meta property="og:image" content="https://ignia.fit/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ignia — a calorie and protein ring with today's totals." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ignia" />
    <meta name="twitter:description" content="A quiet, private calorie + protein log with AI coaching." />
    <meta name="twitter:image" content="https://ignia.fit/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Ignia",
        "alternateName": "Macros",
        "description": "A quiet, private calorie and protein log with AI coaching. Measured TDEE from your own data. No ads. No data selling.",
        "applicationCategory": "HealthApplication",
        "applicationSubCategory": "Nutrition",
        "operatingSystem": "iOS, Android",
        "url": "https://ignia.fit/",
        "downloadUrl": "https://apps.apple.com/app/id6788589414",
        "installUrl": "https://apps.apple.com/app/id6788589414",
        "image": "https://ignia.fit/og-image.png",
        "screenshot": "https://ignia.fit/og-image.png",
        "softwareVersion": "1",
        "inLanguage": ["en", "es-PR"],
        "isAccessibleForFree": true,
        "featureList": [
          "Daily calorie and protein log",
          "Measured TDEE from 14+ days of real data",
          "AI coach grounded in your own logs",
          "Strength-training log with progression, plate calculator and warm-ups",
          "Barcode scanning and USDA + Open Food Facts search",
          "Weight trend with 7-day EMA",
          "Fasting chronometer",
          "Body measurements",
          "Apple Shortcuts webhook",
          "Home-screen widget and Apple Watch complication"
        ],
        "offers": [
          { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" }
        ],
        "author": {
          "@type": "Person",
          "name": "Gabriel Bermudez",
          "url": "https://ignia.fit/"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Bermudez Systems LLC",
          "url": "https://bermudezsystems.com/"
        }
      }
    </script>

    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- iOS Safari prefers 180 for iPhone and 152 for iPad. Declaring each
         avoids iOS scaling a mismatched size when the user adds Ignia
         to the home screen. -->
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- v2 type stack — Geist Sans + Geist Mono. Canonical fonts
         post-v1-retirement; Instrument Serif/DM Sans/JetBrains Mono
         remain loaded above only because preserved utility CSS
         (.field-input etc., still used inside entry-sheet-v2 child
         components) reads from --font-* variables that point at
         them. Geist is what every v2 surface renders in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application. / Por favor habilita JavaScript para continuar usando esta aplicación.</noscript>
  </body>
</html>
